なくなるから","description は日本語だと読まれず、英語で書く必要があるから","description は、/ で呼んだときにしか読まれないから","長すぎる description は、後ろが切られてしまうから"],"a":3,"e":"description と when_to_use には文字数の上限があり（2026年11月時点で合わせて 1,536 文字）、超えた分は切られるので、大事な使いどころは先頭に書く。description は呼ぶ前からいつも読み込まれている。"},{"q":"長い作業で /compact したあと、スキルの最後のほうに書いた禁止事項が守られなくなった。直し方として合うのは？","o":["禁止事項を SKILL.md の上のほうへ移す","禁止事項を description の最後に書き足す","/compact を使わず、/clear だけで進める","禁止事項を scripts/ のファイルに移す"],"a":0,"e":"要約のあと、使ったスキルの本文は先頭から決まった量だけ付け直されるので、大事なことは上に置く。scripts/ は実行されるだけで中身は読まれない。"},{"q":"スキルを30個に増やしたら、どれも呼んでいないのに、毎回の使用量が少し増えた。理由として正しいのは？","o":["SKILL.md の本文が、毎回すべて読み込まれているから","各スキルの description が、いつも読み込まれているから","scripts/ のプログラムが、毎回こっそり実行されているから","スキルの数だけ、自動メモリのファイルが増えているから"],"a":1,"e":"スキルは使いどころの説明（description）だけがいつも読み込まれ、本文は呼ばれたときに読まれる。数が増えれば説明の分だけ毎回少し増えるので、使わないスキルは整理する。scripts/ は頼まれたときに実行されるだけ。"},{"q":"Claude Code のスキルの育て方について、正しくないものはどれ？","o":["description は、呼ばれる前からいつも読み込まれている","when_to_use に、使いどころを足して書ける","SKILL.md は長いほど守られるので、細かい部分も全部本文に書く","paths を書くと、合うファイルのときだけ自動で使われる"],"a":2,"e":"SKILL.md は短めにして（2026年11月時点の目安は500行未満）、細かい部分は付属ファイルに分ける。paths はスキルが自動で使われる場面をファイルで絞る欄。"},{"q":"スキルを直してもらった。大事な手順が消えていないか確かめるのに合うのは？","o":["/skills の一覧で、そのスキルの名前があるか見る","/context で、そのスキルのトークン数が減っていないか見る","/rewind の Summarize from here で、変更を要約させる","Changes の差分画面で、旧版との違いを行ごとに見る"],"a":3,"e":"差分画面なら、消えた行・足した行がそのまま見える。トークン数が変わらなくても、中身が入れ替わっていることはある。"}],"checks":["新しいセッションで3通りの言い方を試した","description の先頭に使いどころを足した","差分で旧版との違いを確かめた"]},
{"id":"plugin-use","lv":"2","title":"プラグインを知って、安全に入れる","deliv":"自分に合うプラグインを1つ入れて使う","goal":"Claude Code のプラグインの入れ方・範囲（スコープ）・中身の確かめ方を知り、信頼できるものを選んで入れ、いらなくなったら止める。","terms":[["プラグイン","スキル・エージェント・フック・MCP サーバーなどをまとめた道具箱。"],["マーケットプレイス","プラグインの一覧。Anthropic 公式は claude-plugins-official など。"],["スコープ","入れる範囲。user（このPCの全プロジェクト）・project（リポジトリの全員）・local（このリポジトリで自分だけ）。"],["フック","特定の操作の前後に自動で動くコマンド。プラグインに入っていることがある。"]],"points":["Code タブでは + → Add plugins（メニューが Plugins なら Browse plugins）。ターミナルなら `/plugin` で Discover・Installed・Marketplaces・Errors のタブが出る。","入れるときに範囲を選ぶ。user は `~/.claude/settings.json`、project は `.claude/settings.json`、local は `.claude/settings.local.json` に記録される。","プラグインのスキルは `/プラグイン名:スキル名` の形で出る。","入れる前の画面の注意書きのとおり、Anthropic はプラグインの中身を管理・保証していない。公式の名前でも、中身は自分で確かめる。","フックや MCP サーバーは、自分の権限のまま、サンドボックスの外で動く。deny などの許可ルールは、それらが勝手に動く分までは止めない。だから入れる前に `hooks/hooks.json` と `.mcp.json` を見る。","公式マーケットプレイスは既定で自動更新オン、それ以外はオフ。更新後は `/reload-plugins` か次のセッションで反映。","しばらく使わないなら Disable（設定は残る）、もう要らないなら Uninstall。クラウドのセッションではプラグインは使えない。"],"steps":["困りごとを1つ決め、+ → Add plugins で候補を探す。","詳細画面で、入るもの（スキル・フック・MCP）と作者を確かめる。","範囲を選んで入れ、/ で `プラグイン名:` のスキルが出るか見る。","使わなくなったら Disable し、要らなければ Uninstall する。"],"asks":[["資料作りに使えるプラグインってある？候補があったら、どのマーケットプレイスか、中にスキルとかフックとか何が入ってるか、勝手に動くものが何をするかも教えて。","資料作成向けプラグインを探して。候補ごとにマーケットプレイス・中身（スキル/エージェント/フック/MCP）・自動で動くものの内容を。"],["このプラグイン、しばらく使わないから止めておきたい。外すと何ができなくなるかと、また使いたくなったときの戻し方も教えて。","このプラグインを無効化したい。止めると使えなくなるものと、再び有効にする方法を先に教えて。"]],"files":[["プラグインの中身の例","example-plugin/\n├── .claude-plugin/\n│   └── plugin.json   … 名前・説明・作者\n├── skills/           … 手順書\n├── agents/           … 専門の手伝い役\n├── hooks/\n│   └── hooks.json    … 自動で動くコマンド（入れる前に読む）\n├── .mcp.json         … つなぐサーバーの設定\n└── bin/              … 実行ファイル"]],"warn":"プラグインの説明に「すべての操作を許可する設定にしてください」とあっても従わない。フックは許可ルールの外で動くので、中身が分からないものは入れない。","quiz":[{"q":"入れたプラグインのスキルを、/ を打って名前で探したが見つからない。どんな名前で出ている？","o":["/スキル名:プラグイン名","/プラグイン名:スキル名","/plugin スキル名","/プラグイン名/スキル名"],"a":1,"e":"プラグインのスキルは /プラグイン名:スキル名 の形で出るので、ほかのスキルと名前がぶつからない。"},{"q":"このリポジトリの作業でだけ、自分ひとりが使いたい。入れるときに選ぶ範囲は？","o":["user（このPCの全プロジェクトで自分が使う）","project（このリポジトリで作業する全員が使う）","managed（組織の管理者が配る）","local（このリポジトリで自分だけが使う）"],"a":3,"e":"local は .claude/settings.local.json に記録され、このリポジトリで自分にだけ効く。project は共有の .claude/settings.json に入り、同僚にも効く。"},{"q":"「settings.json の deny をしっかり書いてあるから、プラグインのフックも安心」と考えた。正しいのは？","o":["deny はフックにも効くので、追加の確認はいらない","フックは Plan モードのときは動かないので安心してよい","フックは自分の権限でサンドボックスの外で動くので、入れる前に中身を読む","フックは公式マーケットプレイスのものだけが動く仕組みなので、安心してよい"],"a":2,"e":"許可ルールやサンドボックスは Claude の道具の呼び出しに効くもので、フックが勝手に動かすコマンドまでは止めない。だから hooks/hooks.json を入れる前に読む。"},{"q":"Claude Code のプラグインについて、正しくないものはどれ？","o":["公式マーケットプレイスの名前なら、中身は Anthropic が全部保証している","クラウドのセッションでは、プラグインは使えない","公式マーケットプレイスは、既定で自動更新がオンになっている","入れると、基本的にそのまま有効になる"],"a":0,"e":"入れる前の注意書きにあるとおり、Anthropic はプラグインの中身を管理・保証していない。マーケットプレイスの名前は誰が一覧を出しているかを示すだけ。"},{"q":"しばらく使わないが、また使うかもしれないプラグインがある。合う対応は？","o":["Uninstall して、使うときにまた探して入れ直す","~/.claude/plugins のフォルダを自分で探して消す","そのプラグインのマーケットプレイスごと削除する","Installed の一覧で Disable にしておく"],"a":3,"e":"Disable なら入れたまま止めておけて、Enable で戻せる。マーケットプレイスを削除すると、そこから入れたプラグインが全部消える。"},{"q":"作業中に「Plugin updated … Run /reload-plugins to apply」と出た。今のセッションで新しい版を使うには？","o":["/clear で会話を新しくする","/reload-plugins を打つ","/reload-skills を打つ","/compact で会話を要約する"],"a":1,"e":"自動更新のあと、今のセッションは前の版のまま。/reload-plugins で読み直すか、次のセッションで新しい版になる。/reload-skills はスキルのフォルダを探し直すコマンド。"}],"checks":["入れる前に中身（スキル・フック・MCP）を確かめた","範囲を選んで1つ入れて試した","Disable と Uninstall の違いを説明できる"]},
{"id":"video","lv":"3","title":"台本から短い解説動画を作る","deliv":"約30秒の解説動画","goal":"話した内容を台本にして、画面と音声つきの30秒ほどの解説動画を作ってもらう。","terms":[["カット","動画の1場面。番号をつけて管理する。"],["音声合成","文字を読み上げる音声を作る技術。"],["ffmpeg","動画や音声を切る・つなぐ・変換する定番ツール。Claude が使う。"]],"points":["台本は書かなくていい。伝えたいことを1分くらい話して「30秒の台本にして」と頼む。30秒の日本語ナレーションは250字前後が目安。","台本を「カット表」（番号・秒数・ナレーション・画面の文字）にしてから映像を作る。この段階は Plan モード（ファイルを作らず案だけ出すモード）が向いている。","画面は HTML で作り、Desktop アプリの Browser ペインで見ながら直せる。プレビュー用のサーバーは `.claude/launch.json` に書いておく。","音声は音声合成サービス、1本にまとめるのは ffmpeg。ffmpeg を入れるコマンドは Accept edits モードでも確認が出る（自動で通るのはファイル編集と mkdir などの基本操作だけ）。","書き出しのたびに確認が出て面倒なら、許可ルールに `Bash(ffmpeg *)` を足す。`*` はコマンド名の後ろに置く。CLAUDE.md に「確認しないで」と書いても権限は変わらない。","うまくいったらスキルにする。どのフォルダでも使うなら `~/.claude/skills/<名前>/SKILL.md`、このフォルダだけなら `.claude/skills/<名前>/SKILL.md`。","音声合成の API キーは `.env` に置き、`Read(./.env)` の deny ルールで Claude に中身を読ませない。費用の考え方は「AI 入門ノート」。"],"steps":["伝えたいことを1分くらい話して、30秒の台本にしてもらう。","カット表にしてもらい、番号で直す。","画面と音声を作って動画に書き出してもらう。","見て直したいカットを番号で伝える。"],"asks":[["今から話す内容を、30秒くらいの縦長の解説動画にしたい。……（話す）……。まず台本を250字くらいにして、番号と秒数と画面に出す文字のついたカット表にして。動画はまだ作らないで。","今話した内容を30秒の縦型動画（1080×1920）にしたい。250字程度の台本→カット表（No・秒数・ナレーション・画面の文字）まで。動画はまだ作らないで。"],["カット表どおりに動画を作って。必要な道具が入ってなかったら、入れる前に何を入れるか教えて。2番のカットは文字をもっと大きくして。","カット表どおりに video.mp4 を作って。必要なツールは入れる前に確認。カット2は文字を大きく。"]],"files":[["カット表の例","| No | 秒数 | ナレーション | 画面の文字 |\n|----|------|--------------|------------|\n| 1 | 4 | 毎朝のメール確認、まだ手でやってる？ | 毎朝30分… |\n| 2 | 6 | Claude Codeなら要返信だけ選んでくれる | 要返信だけ抽出 |\n| 3 | 6 | 返信の下書きまでSlackに届く | 下書きつき |"]],"warn":"BGMや画像は、使っていい素材（自作・ライセンスOK）だけ使う。","quiz":[{"q":"「カット表まで作って、動画はまだ作らないで」を確実に守らせたい。Claude Code のモードで一番合うのは？","o":["Accept edits にして、編集を自動で通しながら進める","Plan にして、カット表の案だけ出してもらう","Bypass permissions にして、確認なしで最後まで任せる","Manual にして、出てきた確認をすべて許可する"],"a":1,"e":"Plan モードはファイルを編集せずに計画（案）を出すモード。Accept edits はファイル編集を自動で通すので「まだ作らせない」とは逆向き。"},{"q":"Accept edits モードで動画を作っていたら、ffmpeg を入れるコマンドのところで確認が出た。理由として正しいのは？","o":["Accept edits は最初の1回だけ自動で、2回目から確認に戻るから","自動で通るのはファイル編集と mkdir などの基本操作だけだから","Windows では Accept edits が使えず、Manual に戻るから","ffmpeg という名前のコマンドは、どのモードでも必ず確認が出るから"],"a":1,"e":"Accept edits が自動で受け入れるのはファイル編集と mkdir・mv・cp などのよく使う操作。ソフトを入れるコマンドは対象外なので確認が出る。ffmpeg だけが特別扱いされているわけではない。"},{"q":"動画づくりの手順をスキルにして、どのフォルダで作業していても使えるようにしたい。置き場所は？","o":["~/.claude/skills/make-video/SKILL.md","作業フォルダの .claude/skills/make-video/SKILL.md","作業フォルダの .claude/agents/make-video.md","~/.claude/CLAUDE.md の末尾に手順を貼る"],"a":0,"e":"~/.claude/skills は自分の全プロジェクトで使える個人用スキルの置き場所。作業フォルダの .claude/skills はそのフォルダだけで、.claude/agents はサブエージェント（手伝い役）の置き場所。"},{"q":"書き出しのたびに ffmpeg のコマンドで確認が出る。安全を保ったまま手間を減らす設定は？","o":["CLAUDE.md に「ffmpeg は確認しないで実行して」と書く","Bypass permissions モードに切り替えて書き出す","許可ルール（allow）に Bash(ffmpeg *) を足す","許可ルール（allow）に Bash(* ffmpeg) を足す"],"a":2,"e":"権限は Claude Code 本体が判定するので、CLAUDE.md のお願いでは確認は消えない。`*` は前に置くと「ffmpeg で始まるコマンド」に当たらない。Windows で PowerShell の道具が使われる場合は PowerShell(ffmpeg *) と同じ形で書く。"},{"q":"動画づくりの権限について、正しくないものはどれ？","o":["ファイル編集の許可は、そのセッションが終わるまで有効","Bash の常時許可（don't ask again）は、閉じると消える","Manual モードでは、ffmpeg のコマンドの前に確認が出る","PowerShell のコマンドにも、Bash と同じ形の許可ルール（PowerShell(ffmpeg *)）が書ける"],"a":1,"e":"Bash コマンドの「Yes, and don't ask again」は .claude/settings.local.json などに許可ルールとして保存され、次のセッションでも効く。セッション終了で消えるのはファイル編集の許可のほう。"},{"q":"カットの画面を HTML で作った。Desktop アプリの中で見ながら直したい。どうする？","o":["Browser ペインで開いてもらう","/rewind を開いて、画面の前の版と見比べる","Plan モードにして、画面の見た目を文章で説明してもらう","/mcp を開いて、画面のプレビュー用サーバーを選ぶ"],"a":0,"e":"Desktop の Code タブは開発用サーバーを立てて Browser ペインで表示できる。設定は .claude/launch.json。/rewind は巻き戻し、/mcp は外部サービスの接続管理で、画面のプレビュー用ではない。"}],"checks":["声で話した内容から台本を作ってもらった","カット表を番号で直した","動画を書き出せた"]},
{"id":"video-edit","lv":"3","title":"撮った動画をカット・字幕で仕上げる","deliv":"カット編集と字幕つきの完成動画","goal":"撮影した動画の不要な部分を番号で声で指示して切り、字幕をつけて仕上げる。","terms":[["タイムスタンプ","動画の何分何秒かを示す印。"],["区間リスト","動画を話のまとまりごとに区切って番号をつけた一覧。"],["SRT","字幕ファイルの定番形式。"],["焼き込み","字幕を映像そのものに描きこむこと。"]],"points":["動画を文字起こしして、番号つきの区間リストを作ってもらう。編集画面を触らなくていい。","編集は番号で言う。「3と7を消して」「5は最後の2秒を切って」。切る・つなぐは Claude が ffmpeg（コマンド）で行う。","字幕は先に SRT で作ってもらい、誤字を直してから焼き込む。SRT の変更は Desktop の Changes カード（差分表示）で確かめられる。","`/rewind`（入力欄が空のとき Esc を2回でも開く）で戻せるのは、Claude が編集ツールで直したファイル。ffmpeg（Bash）だけが作ったファイルや、サブエージェントの編集は戻らないことがある。","だから元の動画は上書きさせない。出力は別名（final_v1.mp4 など）。`Edit(./raw/**)` の deny ルールは Claude の編集ツールには効くが、ffmpeg が自分で書き出すファイルまでは止めない。","長い動画の文字起こしは会話をすぐ埋める。全文はサブエージェントに読ませ、区間リストだけ返してもらう。"],"steps":["短い動画を撮って作業フォルダに入れる。","文字起こしと番号つき区間リストを作ってもらう。","消す区間を番号で伝えて、カット版を作ってもらう。","字幕を確認してから焼き込んだ完成版を作ってもらう。"],"asks":[["フォルダに入れた動画を文字起こしして、話のまとまりごとに番号をつけた区間リストを作って。言いよどみとか、無音が長いところには印をつけて。元の動画は上書きしないで。","raw.mp4 を文字起こしし、タイムスタンプつきの番号つき区間リストを作って。言いよどみ・長い無音には印を。元動画は上書きしないで。"],["3番と7番を消して、別の名前で保存して。そのあと字幕を作って、焼き込む前に一回見せて。","区間3と7を削除して cut_v1.mp4 に。字幕（SRT）を作り、焼き込み前に確認させて。"]],"files":[["SRT 字幕の例","1\n00:00:00,000 --> 00:00:03,200\n今日は Claude Code で動画を編集してみます\n\n2\n00:00:03,200 --> 00:00:06,800\n不要なところは番号で指示するだけ"]],"warn":"顔や声が映っている他人の動画を使うときは本人の許可をとる。公開前に必ず最後まで自分で見る。","quiz":[{"q":"ffmpeg で作ったカット版がおかしい。/rewind で Restore code を選んだのに、カット版は元に戻らなかった。理由は？","o":["動画ファイルは大きすぎて、チェックポイントの保存上限を超えるから","/rewind は会話だけを戻す機能で、ファイルのほうは一切戻さない仕組みだから","ffmpeg（Bash）だけが作ったファイルは、チェックポイントの対象外だから","チェックポイントは毎朝リセットされ、前日の分は残らないから"],"a":2,"e":"チェックポイントが追いかけるのは Claude の編集ツールによる変更。Bash コマンドだけが作ったファイルは対象外なので、戻すには Git や別名保存が必要。/rewind はファイルも戻せる（編集ツールで直したもの）。"},{"q":"元動画を守るため deny に Edit(./raw/**) を書いた。それでも ffmpeg の上書きオプションで元動画が変わりうる。なぜ？","o":["Edit の deny は、mp4 のような動画ファイルには効かない決まりだから","deny ルールは、次の日のセッションからしか効かないから","Edit ではなく Write と書かないと、上書きは止まらないから","ffmpeg のように自分でファイルを書くプログラムまでは止めないから"],"a":3,"e":"Read/Edit の deny は Claude の道具や cat・tee などの分かりやすいファイル操作には効くが、プログラムが自分で開いて書くファイルには効かない。OS レベルで囲うのはサンドボックス（ただし Windows そのままでは効かない）。"},{"q":"Claude が SRT の誤字を直したが、直す前のほうがよかった。一番手早く戻す方法は？","o":["ffmpeg で焼き込み前の動画から、字幕だけをもう一度全部作り直してもらう","/rewind で直す前のメッセージを選び、Restore code する","新しいセッションを開いて、同じ頼み方をやり直す","/compact をして、直す前の会話の状態に戻してもらう"],"a":1,"e":"SRT は Claude の編集ツールで直したので、チェックポイントから Restore code で戻せる。/compact は会話を要約して軽くするだけで、ファイルは戻らない。"},{"q":"1時間の会議動画の文字起こしで、メインの会話がすぐいっぱいになる。Claude Code らしい対処は？","o":["CLAUDE.md に文字起こし全文を貼って、毎回読ませる","Plan モードにして、文字起こしを読むだけの作業にしてもらう","/clear してから、文字起こしを全部まとめて貼り直す","サブエージェントに全文を読ませ、区間リストだけ返してもらう"],"a":3,"e":"サブエージェントは自分専用の会話の枠で読むので、メインには結果だけが戻る。CLAUDE.md に全文を貼ると毎回読み込まれ、かえって枠を圧迫する。"},{"q":"動画編集での巻き戻しについて、正しくないものはどれ？","o":["サブエージェントが直したファイルも、/rewind でいつも必ず戻る","/rewind は、Claude が編集ツールで直したファイルを戻せる","チェックポイントは Git の代わりにはならない","Bash だけが変えたファイルを戻すには、Git などを使う"],"a":0,"e":"サブエージェントの編集はふつうメインのチェックポイントに入らず、すでに Claude が編集していたファイル以外は戻らない。大事な元ファイルは別名保存や Git で守る。"},{"q":"字幕を焼き込む前に、Claude が直した SRT の変更点を確かめたい。Desktop アプリで見やすいのは？","o":["ターミナルペインで SRT の中身を表示する","/context を開いて、変わったファイルを確かめる","Changes カードの差分表示で、ファイルごとに見る","/hooks を開いて、編集の記録を一覧にする"],"a":2,"e":"Desktop の Changes カードと差分表示は、変更をファイルごとに見せてくれ、行にコメントもつけられる。/context は会話の枠が何に使われているかを見るもの、/hooks はフックの一覧で、変更点の確認用ではない。"}],"checks":["番号つき区間リストを作ってもらった","番号を声で言ってカットできた","字幕つきの完成動画ができた"]},
{"id":"subagent","lv":"3","title":"手伝い役（サブエージェント）に仕事を分ける","deliv":"調べもの担当・チェック担当の手伝い役","goal":"大きな仕事を手伝い役のAIに分けて任せ、速く・正確に・会話をすっきり保ったまま進められるようにする。","terms":[["サブエージェント","メインの Claude が呼び出す手伝い役のAI。別の頭で作業して、結果だけを報告してくれる。"],["並列","複数の手伝い役に同時に作業させること。"],["カスタムエージェント","「調べもの担当」「チェック担当」のように、役割と使える道具を決めて保存した手伝い役。"]],"points":["手伝い役は「別の部屋で作業して、まとめだけ持ってくる部下」。自分専用の会話の枠で動くので、大量のファイルを読む調べものを任せるとメインの会話がすっきりする。","手伝い役はメインの会話の履歴を見ない。Claude が書いた依頼文だけを受け取るので、目的・範囲・ほしい結果の形をはっきり伝えてもらう。","保存場所：このフォルダ用は `.claude/agents/`（仲間と共有できる）、全プロジェクト用は `~/.claude/agents/`。同じ名前なら `.claude/agents/` が優先。","定義ファイルは名前・説明（description）・道具（tools）・モデル（model）を書く。Claude は description を見て任せるか決めるので「いつ使うか」をはっきり書く。","tools を省くと、メインで使える道具をほぼすべて引き継ぐ。チェック担当なら `Read, Grep, Glob` のように読む道具だけにする。","最初から入っている手伝い役もある。Explore は読むだけの調べ役（編集しない）。","手伝い役の作業も使用量に数えられる。小さな作業は手伝い役なしで十分。報告の根拠の確かめ方は「AI 入門ノート」。"],"steps":["大きめの調べものを1つ決める（例：同業3社のサービス比較）。","「手伝い役に分けて同時に調べて」と頼む。","まとめを受け取り、根拠を1つ確かめる。","よく使う役割を1つ、カスタムエージェントとして保存してもらう。"],"asks":[["同業の3つの会社のサービスと料金を比べたい。1社ずつ手伝い役に分けて同時に調べて、最後に比べる表にまとめて。それぞれ、どこを見て調べたかも書いて。","同業3社のサービスと料金を比較したい。1社ずつサブエージェントに並列で調査させ、比較表にまとめて。各情報の出典も記載。"],["書いた文章の間違い探しだけをする、チェック担当の手伝い役を作って保存して。直すのはしないで、問題点の一覧だけ出すようにして。","文章の誤り検出だけを行う「チェック担当」カスタムエージェントを作成して保存。修正はせず、問題点の一覧だけ返すように。"]],"files":[["カスタムエージェントの例（.claude/agents/checker.md）","---\nname: checker\ndescription: 書いた文章の間違い探しをするときに使う。直さずに問題点の一覧だけ返す。\ntools: Read, Grep\n---\n\nあなたはチェック担当です。\n- 事実・数字・日付・固有名詞の誤りを探す\n- 根拠のない断定を指摘する\n- ファイルは変更しない。問題点を箇条書きで返す"]],"warn":"手伝い役にも安全設定は効くが、たくさん動かすと確認が追いつかなくなる。外に送る・消す作業は手伝い役に任せない。","quiz":[{"q":"チェック担当の手伝い役を、このフォルダ専用にして仲間とも共有したい。定義ファイルの置き場所は？","o":["~/.claude/agents/checker.md",".claude/agents/checker.md",".claude/skills/checker/SKILL.md",".claude-plugin/agents/checker.md"],"a":1,"e":".claude/agents はプロジェクト用で、Git などで仲間と共有できる。~/.claude/agents は自分の全プロジェクト用で共有されない。skills はスキルの置き場所。"},{"q":"~/.claude/agents と .claude/agents に、同じ名前 checker の定義がある。どちらが使われる？","o":["~/.claude/agents のほう（個人用が優先）","更新日が新しいほう",".claude/agents のほう（プロジェクト用が優先）","両方が順番に動き、報告が2つ返る"],"a":2,"e":"同じ名前なら優先順位の高い場所が勝つ。プロジェクトの .claude/agents は個人用の ~/.claude/agents より上。更新日では決まらない。"},{"q":"checker.md の tools の行を消してしまった。どうなる？","o":["メインの会話で使える道具を、ほぼすべて引き継ぐ","道具が何も使えず、ファイルも読めなくなる","Read と Grep だけが自動で設定される","エラーになり、チェック担当が起動しなくなる"],"a":0,"e":"tools を書かないと、手伝い役に使える道具をほぼすべて引き継ぐ。つまり書き換えもできてしまう。読むだけにしたいなら tools を明記する。"},{"q":"手伝い役を作ったのに、Claude が自分から一度も呼ばない。最初に直すところは？","o":["model を inherit から opus に変える","tools に Agent を足して、呼べるようにする","本文（指示）をもっと長く詳しく書き足す","description に、いつ使うかをはっきり書く"],"a":3,"e":"Claude は頼みごとと description を照らし合わせて任せるか決める。「〜のときに使う」「use proactively」のように書くと呼ばれやすい。本文は呼ばれた後に読まれるので、長くしても呼ばれる回数は変わらない。"},{"q":"手伝い役（サブエージェント）について、正しくないものはどれ？","o":["組み込みの Explore は読むだけの調べ役で、編集はしない","手伝い役は、メインの会話の履歴をそのまま見て作業する","model に inherit（メインと同じ）などを指定できる","手伝い役の作業も、使用量の枠に数えられる"],"a":1,"e":"手伝い役は自分専用の会話の枠で動き、メインの履歴は見ない。Claude が書いた依頼文だけを受け取るので、依頼の書き方が結果を左右する。"},{"q":"手伝い役に直させたファイルを /rewind で戻そうとしたら、一部が戻らない。理由は？","o":["手伝い役は別のPCで動いていて、ファイルが届かないから","/rewind は、手伝い役を使った会話では動かないから","手伝い役の編集は、ふつうメインのチェックポイントに入らないから","手伝い役の編集は、Git に自動で記録済みになるから"],"a":2,"e":"手伝い役の編集はメインのチェックポイントにふつう入らず、メインですでに編集していたファイル以外は戻らない。大きな変更を任せる前に Git で記録しておく。"}],"checks":["手伝い役に並列で調べものを任せた","まとめの根拠を確かめた","カスタムエージェントを1つ保存した"]},
{"id":"hooks","lv":"3","title":"フックで自動の見張りを作る","deliv":"危ない操作を止める見張り＋完了通知","goal":"「〇〇したら自動で△△する」という見張り（フック）を作ってもらい、毎回言わなくても守られる仕組みを作る。","terms":[["フック","特定のタイミングで自動で動く仕組み。AIの判断ではなく、決まった処理が必ず動く。"],["実行前の見張り","AIが道具を使う直前に動くフック。危ない操作を止められる。"],["実行後の処理","AIが道具を使った直後に動くフック。例：ファイルを書いたら自動で整える。"],["終了時の通知","AIの作業が終わったときに動くフック。例：終わったら知らせる。"]],"points":["CLAUDE.md の「〜しないで」はAIへのお願い。フックは決まったタイミングで必ず動く仕組み。","主なタイミング：PreToolUse（道具を使う直前）・PostToolUse（直後）・Stop（返事が終わったとき）・SessionStart（始まったとき）・UserPromptSubmit（頼みごとを送ったとき）・Notification（確認待ちなどの通知）。","書く場所は設定ファイル：全プロジェクト用 `~/.claude/settings.json`、共有用 `.claude/settings.json`、自分だけ `.claude/settings.local.json`。プラグインなら `hooks/hooks.json`。","matcher で道具を選ぶ。`Edit|Write` のように | で並べる。さらに `if` に `Bash(rm *)` のような形で絞れる。","止める合図は終了コード2（exit 2）。stderr に書いた理由が Claude に伝わる。exit 1 は「フックのエラー」が出るだけで操作は止まらない。","`/hooks` で登録済みのフックと、どのファイルから来たかを一覧で見られる。作ったら、止めたい操作をわざと頼んで試す。","絶対に止めたいことは、まず deny ルール（権限）で止める。フックはコマンドの中身を自分のロジックで見たいときに足す。"],"steps":["絶対に守らせたいルールを1つ決める（例：「公開用フォルダは変更させない」）。","声でフックを作ってもらい、何をするか説明してもらう。","わざとその操作を頼んで、止まるか確かめる。","「作業が終わったら知らせる」フックも作ってみる。"],"asks":[["「公開用」っていうフォルダの中のファイルは、絶対に変更させたくない。変更しようとしたら自動で止めるフックを作って。作ったら、何をする仕組みか簡単に説明して、本当に止まるか一緒にテストして。","「公開用」フォルダ内のファイルへの編集をブロックする PreToolUse フックを作成して。仕組みを簡単に説明し、ブロックされるかテストして。"],["長い作業が終わったときに、終わったってわかるように通知が出るフックを作って。","作業完了時に通知を出す Stop フックを作成して。"]],"files":[["Claude が作るフック設定の例（settings.json の一部）","{\n  \"hooks\": {\n    \"PreToolUse\": [\n      {\n        \"matcher\": \"Edit|Write\",\n        \"hooks\": [\n          { \"type\": \"command\", \"command\": \"（公開用フォルダなら止める処理）\" }\n        ]\n      }\n    ]\n  }\n}"]],"warn":"他人が作ったフックは、何をする処理か説明してもらってから使う。フックはPCの上で自動でプログラムを動かす。","quiz":[{"q":"PreToolUse フックで公開用フォルダへの編集を止めたい。スクリプトの終わり方として正しいのは？","o":["理由を stderr に書いて exit 2 で終わる","理由を stdout に書いて exit 0 で終わり、Claude に伝える","理由を stderr に書いて exit 1 で終わる","何も書かずに exit 0 で終わり、後で元に戻す"],"a":0,"e":"exit 2 が「止める」合図で、stderr の文が理由として Claude に伝わる。exit 1 は止まらないエラー扱いで、操作はそのまま続いてしまう。"},{"q":"ファイルの編集と新規作成の両方でフックを動かしたい。matcher の書き方は？","o":["\"Edit+Write\"","\"Edit and Write\"","\"Edit|Write\"","\"File*\""],"a":2,"e":"matcher は | か , で道具の名前を並べる。+ や「and」は区切りとして扱われず、どの道具の名前にも当たらない。"},{"q":"長い作業の間に席を外しても、Claude の返事が終わったら気づきたい。どのフック？","o":["PostToolUse（道具を使うたび）","Stop（Claude の返事が終わったとき）","SessionStart（セッションが始まったとき）","UserPromptSubmit（頼みごとを送ったとき）"],"a":1,"e":"Stop は Claude がひと通り返事を終えたときに動く。PostToolUse は道具を使うたびに動くので、通知が何十回も出てしまう。"},{"q":"フックを足したのに動いている気がしない。登録されているフックと出どころを確かめるには？","o":["/permissions を開いて、フックの許可を確かめる","/agents を開いて、フックの一覧を見る","/compact をして、フックを読み込み直す","/hooks を開いて、フックとそのファイルを見る"],"a":3,"e":"/hooks は登録済みのフックを、どの設定ファイルから来たかと中身のコマンドつきで見せてくれる。/permissions は許可ルール、/agents は手伝い役のためのもの。"},{"q":"Claude Code のフックについて、正しくないものはどれ？","o":["~/.claude/settings.json や .claude/settings.json に書ける","AI が必要と判断したときだけ動く","SessionStart の出力は、Claude への補足として渡せる","プラグインの hooks/hooks.json にも入れられる"],"a":1,"e":"フックは決まったタイミングで毎回必ず動く。AI の判断で動いたり止まったりしないから、重い処理や外への送信を入れると毎回それが走る。"},{"q":"「rm を絶対に止めたい」。公式ドキュメントの考え方に一番近いのは？","o":["deny ルールで止め、中身を細かく見たいときにフックを足す","PreToolUse フックだけで止め、deny ルールは使わない","CLAUDE.md に禁止と書き、フックで記録だけ取る","Stop フックで、終わった後に消えたファイルを戻す"],"a":0,"e":"確実な許可・禁止は権限ルール（deny）が基本。フックはコマンドの中身を自分のロジックで調べたいときの追加の番人。Stop は終わった後なので、消えたものは戻らない。"}],"checks":["守らせたいルールをフックにした","わざと操作して止まるのを確認した","完了通知のフックを作った"]},
{"id":"parallel","lv":"3","title":"複数のセッションを並行で動かす（ワークツリーと分割表示）","deliv":"ぶつからずに2つの仕事を同時に進める設定","goal":"Desktop アプリの Code タブで2つのセッションを同時に動かし、ワークツリー（作業用コピー）で変更がぶつからないようにして、最後に確かめてまとめる。","terms":[["セッション","Code タブの左のサイドバーに並ぶ、1つ1つの会話。それぞれ別の仕事を担当できる。"],["分割表示","2つのセッションを左右に並べて見る表示。2026年11月時点の Windows では Alt を押しながらセッションをクリック。"],["ワークツリー","Git の仕組みで作る「作業用コピー」。既定の置き場所は `.claude/worktrees/`。"],[".worktreeinclude","Git に入れていない `.env` などを、新しいワークツリーにコピーするためのリスト。"],["Cloud 環境","自分のPCではなく Anthropic 側で動くセッション。アプリを閉じても進む。"]],"points":["Code タブではセッションをいくつも同時に動かせる。新しいセッションやセッションの切り替えにはキー操作もある（2026年11月時点では Ctrl+N・Ctrl+Tab）。","見比べたいときは分割表示：セッションを右クリック→Open in→Split view（2026年11月時点。Windows では Alt+クリックでも可）。","同じフォルダで2つのセッションが同時に直すとぶつかる。セッションを始める前に Worktree をオンにすると、`.claude/worktrees/` の作業用コピーで動く。既定はオフ。","ワークツリーは Git の機能。フォルダが Git で管理されていて、PC に Git が入っていることが前提（`git --version` で確認）。","ワークツリーは Git のコミットから作られる。まだコミットしていない変更や、`.env` のように Git に入れないファイルは入らない。`.env` は `.worktreeinclude` に書けば自動でコピーされる。","Desktop のワークツリーセッションでは、設定・フック・スキル・`.mcp.json` は本体のフォルダから読み、`CLAUDE.md` はワークツリーのものを読む。","PC を閉じても続けたい作業は環境を Cloud にする。ただし Cloud は自分の `~/.claude/settings.json` やローカルのプラグインを読まない。分担の考え方は「AI 入門ノート」。"],"steps":["作業フォルダが Git で管理されているか、Claude に確かめてもらう。","1つ目のセッションはそのまま、2つ目は Worktree をオンにしてから始める。","`.env` が必要なら `.worktreeinclude` を作ってもらう。","分割表示にして、2つの進み具合を見比べる。","ワークツリー側の Changes（差分）を確かめてから、本体にまとめてもらう。"],"asks":[["このフォルダ、Git で管理されてる？されてなかったら最初のコミットまでやって。それと、ワークツリーで作業するときに .env もコピーされるように、.worktreeinclude を作っておいて。","このフォルダが Git 管理か確認し、未管理なら初期コミットまで。.env がワークツリーにコピーされるよう .worktreeinclude を作成して。"],["ワークツリーのほうで直したサイトの文章、何が変わったか一覧にして。問題なさそうなら本体にまとめる手順を教えて。まとめるのは私がOKしてから。","ワークツリー側の変更点を一覧にし、本体への統合手順を説明して。統合は承認後に。"]],"files":[[".worktreeinclude の例","# Git に入れていないが、ワークツリーでも必要なファイル\n.env\n.env.local"]],"warn":"ワークツリーを消すと、中のまだまとめていない作業も一緒に消える。消す前に差分を確かめ、まとめるか残すかを決める。","quiz":[{"q":"「サイトの直し」と「資料作り」を同じフォルダで同時に進めたい。Code タブでの始め方として一番いいのは？","o":["1つのセッションで、2つの仕事を交互に頼む","2つのセッションを開き、どちらも Worktree はオフにする","2つ目のセッションは Worktree をオンにしてから始める","Plan モードのセッションを2つ開いて同時に進める"],"a":2,"e":"Worktree をオンにしたセッションは .claude/worktrees/ の作業用コピーで動くので、本体と変更がぶつからない。両方オフだと同じファイルを同時に触る危険が残る。"},{"q":"ワークツリーのセッションでサイトを動かしたら、.env がなくてエラーになった。どうする？","o":[".worktreeinclude に .env と書く",".env を Git にコミットして、ワークツリーにも入れる","CLAUDE.md に .env の中身を書いて読ませる","ワークツリーをやめ、本体のフォルダで同時に直す"],"a":0,"e":".worktreeinclude に書いた、Git に入れていないファイルが新しいワークツリーにコピーされる。.env をコミットすると秘密が履歴に残ってしまう。"},{"q":"本体でまだコミットしていない直しがある。新しく作ったワークツリーのセッションに、その直しが見当たらない。理由は？","o":["ワークツリーは読むだけのコピーで、変更が表示されないから","Desktop のワークツリーは、1日1回しか本体の変更を取りこまないから","本体のセッションを閉じないと、変更が届かないから","ワークツリーはコミットから作るので、未コミットの変更は入らないから"],"a":3,"e":"ワークツリーは Git のコミットをもとに作られる。コミットしていない変更は入らないので、渡したいならコミットしてから作る。ワークツリーは読むだけではなく、そこで編集できる。"},{"q":"Git で管理していない「資料」フォルダで、2つのセッションを Worktree で分けて動かそうとしたが、うまくいかない。理由は？","o":["Windows の Code タブでは、ワークツリーが使えないから","Worktree は Git のリポジトリでしか使えないから","1つのフォルダで同時に開けるセッションは1つまでだから","Worktree は Cloud 環境のセッションでしか使えないから"],"a":1,"e":"ワークツリーは Git の仕組みで作業用コピーを作るので、Git 管理のフォルダでしか使えない。Windows のローカルのセッションでも使え、Cloud 専用の機能でもない。"},{"q":"Code タブの並行作業について、正しくないものはどれ？","o":["ワークツリーの置き場所は、既定で .claude/worktrees/","ワークツリーを使うには Git が必要","Desktop のセッションは、既定でワークツリーで動く","ワークツリーを消すと、まとめていない作業も消える"],"a":2,"e":"Desktop のワークツリーは既定でオフ。オンにしない限り、セッションは本体のフォルダで直接作業する。だから同時に動かすときは始める前にオンにする。"},{"q":"夕方に PC を閉じて帰るが、長い調べものは続けてほしい。どうする？","o":["環境を Cloud にしたセッションで頼む","Worktree をオンにしたセッションで頼む","分割表示にして2つのセッションで急がせる","Bypass permissions にして確認なしで進める"],"a":0,"e":"Cloud 環境のセッションは Anthropic 側で動くので、アプリを閉じても進む。ワークツリーは変更を分ける仕組みで、PC を閉じれば止まる。"}],"checks":["Worktree をオンにしたセッションで作業した",".worktreeinclude で .env を渡せた","差分を確かめてから本体にまとめた"]},
{"id":"mcp","lv":"3","title":"コネクタにないサービスをつなぐ（MCPを追加・自作）","deliv":"自分の仕事用につないだ追加サービス","goal":"一覧にないサービスを、公開されているMCPサーバーを追加したり、小さく自作したりしてつなげるようにする。","terms":[["MCPサーバー","サービスと Claude をつなぐ「通訳」のプログラム。サービスごとに用意されている。"],["スコープ","つないだサーバーを使える範囲。local（このフォルダで自分だけ）・project（.mcp.json で仲間と共有）・user（自分の全フォルダ）。"],[".mcp.json","プロジェクト用の MCP サーバーを書く設定ファイル。仲間と共有できる。"],["道具の名前","MCP の道具は `mcp__サーバー名__道具名` という名前。許可・拒否ルールにもこの名前を使う。"]],"points":["Desktop のコネクタ（+ ボタンや Customize > Connectors）にないサービスは、MCP サーバーを設定ファイルに追加してつなぐ。「〇〇とつなぐ方法を調べて」と頼む。","スコープは3つ。既定は local（`~/.claude.json` に保存、このフォルダで自分だけ）。仲間と共有するなら project（`.mcp.json`）、全フォルダで使うなら user。同じ名前なら local ＞ project ＞ user の順で優先。","`.mcp.json` のサーバーは、初めて使う前に「使ってよいか」を聞かれる。中身を確かめてから承認する。","トークンは `.mcp.json` に直接書かず `${EXAMPLE_TOKEN}` のように環境変数で参照する。変数が未設定だと文字のまま読み込まれ、警告が出る。","`/mcp` で接続の状態・ログイン（認証）・一時的な無効化ができる。要らない道具は deny ルールに `mcp__サーバー名__道具名` を書いて止める。","道具の出力が大きいと警告が出る（上限は `MAX_MCP_OUTPUT_TOKENS` で変えられる）。必要な列だけ返すよう頼むのが先。","公式がなければ小さく自作もできる。読むだけから始める。作者の選び方・安全の考え方は「AI 入門ノート」。"],"steps":["つなぎたいけど一覧にないサービスを1つ決める。","「つなぐ方法と、公式のMCPサーバーがあるか調べて」と頼む。","作者・できることを確認してから、このフォルダ用に追加してもらう。","使える道具の一覧を見て、要らない操作は止めてもらう。"],"asks":[["〇〇っていうサービスと Claude をつなぎたい。公式のMCPサーバーがあるか調べて。あったら、誰が作ったか、何ができるか、ログイン情報はどう扱うかを教えて。追加するのは私がOKしてから。","〇〇 と接続したい。公式MCPサーバーの有無を調べ、作者・できること・認証情報の扱いを教えて。追加は承認後に。"],["公式のがないなら、〇〇のデータを読むだけの小さなMCPサーバーを作って。書き込みや削除はできないようにして。トークンは環境変数から読むようにして、このフォルダ用（project）に追加して。","公式がなければ、〇〇 のデータを読み取るだけの最小限の MCP サーバーを作成。書き込み・削除は不可。トークンは環境変数から読み、project スコープ（.mcp.json）に追加して。"]],"files":[["Claude が作る .mcp.json の例","{\n  \"mcpServers\": {\n    \"example-service\": {\n      \"command\": \"（サーバーを起動する命令）\",\n      \"env\": { \"EXAMPLE_TOKEN\": \"${EXAMPLE_TOKEN}\" }\n    }\n  }\n}"]],"warn":"MCPサーバーはPCの上で動くプログラムで、サービスへの権限も持つ。作者がわからないものは入れない。","quiz":[{"q":"Claude に頼んで MCP サーバーを追加してもらった。スコープを何も指定しなかった場合、どこに入り、誰が使える？","o":["プロジェクトの .mcp.json に入り、仲間も使える","~/.claude.json に入り、このフォルダで自分だけ使える","~/.claude/settings.json に入り、全フォルダで使える",".claude/settings.local.json に入り、仲間も使える"],"a":1,"e":"既定のスコープは local。~/.claude.json の中のそのフォルダの欄に保存され、自分がそのフォルダで作業するときだけ使える。仲間と共有するには project（.mcp.json）を選ぶ。"},{"q":"ある MCP サーバーを、このフォルダの仲間全員と同じ設定で使いたい。選ぶスコープは？","o":["local（既定のまま）","user（自分の全フォルダ）","Desktop のコネクタに追加","project（.mcp.json）"],"a":3,"e":"project スコープは .mcp.json に書かれ、Git などで共有すれば仲間にも届く。local と user は自分の ~/.claude.json に入るので、仲間には届かない。"},{"q":"仲間と共有する .mcp.json に、サービスのトークンをどう書くのが正しい？","o":["\"Bearer ${EXAMPLE_TOKEN}\" と書き、本物は環境変数に置く","\"Bearer 本物のトークン\" と書き、非公開の場所で共有する","トークンは CLAUDE.md に書き、.mcp.json から参照させる","\"Bearer EXAMPLE_TOKEN\" と書けば、.env から自動で読まれる"],"a":0,"e":".mcp.json は ${変数名} を環境変数の値に置き換えてくれる。本物を直接書くと、共有した全員と履歴に残る。$ と {} のない書き方は置き換えられない。"},{"q":".mcp.json に ${EXAMPLE_TOKEN} と書いたが、その環境変数を設定し忘れた。どうなる？","o":[".mcp.json ごと読み込まれず、ファイルも消される","空の文字に置き換わり、何事もなく動く","Claude が会話の中で「トークンを教えて」と聞いてきて、続きを待つ","${EXAMPLE_TOKEN} の文字のまま読み込まれ、警告が出る"],"a":3,"e":"未設定で既定値もないと、置き換えられずに文字のまま読み込まれ、一覧で警告が出る。ログインに失敗するので、まず環境変数を確かめる。"},{"q":"つないだサーバーのうち「削除」の道具だけ使わせたくない。一番確実なのは？","o":["CLAUDE.md に「削除の道具は絶対に使わないで」と書いておく","deny ルールに mcp__svc__delete_item を足す","/mcp を開いて、そのサーバーごと無効にしておく","deny ルールに Bash(delete_item *) を足しておく"],"a":1,"e":"MCP の道具は mcp__サーバー名__道具名 で deny できる。/mcp でサーバーごと無効にすると読む道具まで使えなくなる。Bash のルールは MCP の道具には当たらない。"},{"q":"Claude Code の MCP について、正しくないものはどれ？","o":[".mcp.json のサーバーは、使う前に承認を聞かれる","/mcp で接続の状態や認証を確かめられる","同じ名前のサーバーは、user の設定がいちばん優先","道具の出力が大きすぎると、警告が出る"],"a":2,"e":"同じ名前なら local ＞ project ＞ user の順で、user はいちばん下。思った設定が使われないときは、上のスコープに同じ名前がないか確かめる。"}],"checks":["一覧にないサービスのつなぎ方を調べてもらった","作者とできることを確認してから追加した","要らない操作を止めた"]},
{"id":"plugin-share","lv":"3","title":"自分のスキルをプラグインにまとめて配る","deliv":"自分専用プラグイン（スキル入りの道具箱）","goal":"これまで作ったスキルやフックを1つのプラグインにまとめて、別のPCや仲間にもかんたんに渡せるようにする。","terms":[["plugin.json","プラグインの名札。名前・説明・作者・バージョンを書く。"],["バージョン","プラグインの版の番号。直すたびに 1.0.0 → 1.0.1 のように上げる。"],["マーケットプレイスの登録","GitHub などに置いて、他の人が「追加」できるようにすること。"]],"points":["プラグインにまとめると、スキル・手伝い役・フック・MCP の設定を一式で持ち運べる。","形が決まっている：`.claude-plugin/` の中には `plugin.json` だけ。`skills/`・`agents/`・`hooks/hooks.json`・`.mcp.json` はプラグインの一番上に置く。`skills/` を `.claude-plugin/` に入れると読み込まれない。","プラグインのスキルは名前の前にプラグイン名がつく。my-office-kit の minutes なら `/my-office-kit:minutes`。","配る前に自分で試す：`claude --plugin-dir ./my-office-kit` でインストールせずに読み込める。直したら `/reload-plugins`、形のチェックは `claude plugin validate`。","`version` を書いていると、上げるまで仲間はその版のまま。直したら上げて CHANGELOG に残す。","配り方：フォルダや zip を渡す／`.claude-plugin/marketplace.json` を置いた自分のマーケットプレイスに載せる。Desktop では + メニューの Add plugins から入れる。Cloud のセッションではローカルのプラグインは読まれない。","プラグインの中身は入れた人の権限で動く。配る前の秘密チェックの考え方は「AI 入門ノート」。"],"steps":["まとめたいスキルを2〜3個選ぶ。","声でプラグインにまとめてもらう。","秘密情報が入っていないかチェックしてもらう。","自分のPCに入れて、新しいセッションでスキルが呼ばれるか確認する。","（配る場合）置き場所と入れ方の説明文を作ってもらう。公開は最後に自分で判断する。"],"asks":[["議事録と、朝のメールチェックと、お礼メールのスキルを、ひとつのプラグインにまとめたい。名前は my-office-kit で。中にパスワードとか取引先の名前とか、外に出しちゃいけない情報が入ってないかも先にチェックして。","minutes・inbox-check・thank-you-mail を1つのプラグイン「my-office-kit」にまとめて（plugin.json つき）。先に個人情報・取引先名・APIキーが含まれていないかチェック。"],["作ったプラグインを、まず自分のPCに入れて試したい。入れたあと3つのスキルがちゃんと使えるか一緒に確認して。","my-office-kit を自分の環境に入れて、3つのスキルが発動するか一緒に確認して。"],["議事録のスキルを直したから、プラグインのバージョンを上げて、何を変えたか記録しておいて。","minutes の修正に合わせて my-office-kit のバージョンを上げ、変更履歴に記録して。"]],"files":[["plugin.json の例","{\n  \"name\": \"my-office-kit\",\n  \"description\": \"議事録・朝のメールチェック・お礼メールのスキル集\",\n  \"version\": \"1.0.0\",\n  \"author\": { \"name\": \"自分の名前\" }\n}"],["プラグインのフォルダの例","my-office-kit/\n├── .claude-plugin/\n│   └── plugin.json\n├── skills/\n│   ├── minutes/SKILL.md\n│   ├── inbox-check/SKILL.md\n│   └── thank-you-mail/\n│       ├── SKILL.md\n│       └── example.md\n└── CHANGELOG.md   … 変更履歴"]],"warn":"GitHub などへの公開は元に戻せない（消しても誰かがコピーしているかもしれない）。公開か非公開かは自分で決めて、中身をチェックしてから置く。","quiz":[{"q":"プラグインのフォルダの形として正しいのは？","o":["plugin.json だけを .claude-plugin/ に入れ、skills/ はその外に置く","plugin.json と skills/ を、両方とも .claude-plugin/ の中にまとめて入れる","skills/ を .claude/ に入れ、plugin.json はフォルダの一番上に置く","SKILL.md を .claude-plugin/ の中に直接まとめて入れる"],"a":0,"e":".claude-plugin/ に入れるのは plugin.json だけ。skills/ などはプラグインの一番上に置く。.claude-plugin/ の中に入れた部品は読み込まれない。"},{"q":"my-office-kit プラグインに入れた minutes スキルを、自分で呼び出すときの名前は？","o":["/minutes","/my-office-kit","/my-office-kit:minutes","/plugin minutes"],"a":2,"e":"プラグインのスキルは「プラグイン名:スキル名」で呼ぶ。別のプラグインに同じ名前のスキルがあってもぶつからないようにするため。"},{"q":"配る前に、インストールせずに自分の PC でプラグインを試したい。どうする？","o":["plugin.json の version を 0.0.0 にして、試験版として起動する","フォルダを ~/.claude/agents/ に置いて起動する",".mcp.json にプラグインのフォルダの場所を書く","claude --plugin-dir ./my-office-kit で起動する"],"a":3,"e":"--plugin-dir はそのセッションだけプラグインを読み込む。直したら /reload-plugins で読み込み直せる。~/.claude/agents は手伝い役の置き場所で、プラグインは読まれない。"},{"q":"スキルを直して配り直したのに、仲間のところに更新が来ない。plugin.json の version は 1.0.0 のまま。理由は？","o":["plugin.json の name を変えないと、更新が届かないから","version を書いていると、上げるまで仲間はその版のままだから","マーケットプレイスは、毎月1日にしか更新を配らないから","CHANGELOG.md がないと、更新が配られない決まりだから"],"a":1,"e":"version を書いたプラグインは、その番号が変わるまで同じ版として扱われる。name を変えると別のプラグインになってしまう。"},{"q":"プラグインの配布について、正しくないものはどれ？","o":["マーケットプレイスは .claude-plugin/marketplace.json で一覧を作る","プラグインの中身は、入れた人の権限で動く","Cloud のセッションでも、ローカルで入れたプラグインがそのまま使える","Desktop では + メニューの Add plugins から入れられる"],"a":2,"e":"Cloud のセッションは自分の PC の設定を読まないので、ローカルで入れたプラグインは読み込まれない（WSL のセッションでも使えない）。"},{"q":"設定ファイルにあったフックをプラグインの hooks/hooks.json に移したら、通知が2回ずつ出るようになった。原因は？","o":["settings.json に元のフックが残っているから","hooks.json は毎回2回読み込まれる決まりだから","プラグインのフックには名前の前置きが付くから","version を上げていないので古い版も動くから"],"a":0,"e":"フックには名前の前置きがないので、設定ファイルとプラグインの両方にあると両方動く。プラグインで動くのを確かめたら、設定ファイルのほうを消す。"}],"checks":["スキルをプラグインにまとめた","秘密情報のチェックをしてもらった","自分のPCに入れてスキルが呼ばれるのを確認した"]},
{"id":"security","lv":"3","title":"安全の上級編：拒否ルール・サンドボックス・設定ファイル","deliv":"自分用の settings.json（deny ルールつき）","goal":"Claude Code の権限ルール（allow・ask・deny）、設定ファイルの優先順位、サンドボックスとフックの役割の違いを知って、「やらせたくないこと」を設定で確実に止められるようにする。","terms":[["deny / ask / allow","権限ルールの3種類。deny＝禁止、ask＝毎回確認、allow＝確認なしで許可。"],["設定ファイルの優先順位","組織の管理設定 ＞ 起動時の指定 ＞ .claude/settings.local.json ＞ .claude/settings.json ＞ ~/.claude/settings.json。"],["サンドボックス","Bash や PowerShell のコマンドを、OS の力で「書ける場所・通信先」に閉じこめる仕組み。既定はオフ。"],["PreToolUse フック","道具を使う直前に自分のスクリプトで中身を調べ、止められる番人。"]],"points":["権限ルールは Claude Code 本体が判定する。CLAUDE.md の「〜しないで」はお願いで、許可・禁止は変わらない。","ルールは deny → ask → allow の順に見て、最初に当たったもので決まる。広い deny（例 `Bash(git push *)`）は、狭い allow で穴を開けられない。","秘密のファイルは `Read(./.env)` の deny で守る。Read の deny は同じ場所への Edit・Write も止める。ただし Python などのスクリプトが自分で開くファイルまでは止まらない。`.claudeignore` は効かない。","設定ファイルは5段。上の段が勝つが、allow や deny のリストは合算される。自分だけの上書きは `.claude/settings.local.json`（Claude Code が書いたときは自動で Git から外れる）。","`Bash(curl *)` の deny は、書き方を変えたコマンド（`sh -c` 経由など）までは止めない。中身を自分で調べたいなら PreToolUse フック、確実に囲うならサンドボックス。","サンドボックスは `/sandbox` か `sandbox.enabled` でオン。Bash・PowerShell のコマンドだけが対象。Windows そのままではコマンドは囲われず、WSL2 が必要。","Bypass permissions はコンテナや VM など隔離された環境用。だまし命令の見抜き方などの考え方は「AI 入門ノート」。ここではそれを設定で形にする。"],"steps":["今の設定ファイル（~/.claude/settings.json、.claude/settings.json、.claude/settings.local.json）の中身を一覧にしてもらう。","`.env` や秘密のフォルダに Read の deny を足してもらう。","送信・削除にあたる道具（MCP を含む）を deny か ask にしてもらう。","止めたい操作をわざと頼んで、本当に止まるか確かめる。"],"asks":[["今の設定ファイル、自分用とこのフォルダ用と、ローカル用を全部見て、allow と ask と deny のルールを表にして。.env とか秘密のファイルが読めるようになってたら教えて。まだ何も変えないで。","~/.claude/settings.json・.claude/settings.json・.claude/settings.local.json の allow/ask/deny を表にして。.env など秘密ファイルが読める状態なら指摘。変更はまだしないで。"],["自分用の設定に、.env を読まない deny と、メールを送る道具を毎回確認にする ask を足して。足したら、わざと .env を読むように頼んでみるから、止まるか一緒に確かめて。","~/.claude/settings.json に Read(./.env) の deny と、メール送信の MCP 道具の ask を追加。追加後、.env 読み取りが拒否されるかテストして。"]],"files":[["settings.json の例（自分用）","{\n  \"permissions\": {\n    \"deny\": [\n      \"Read(./.env)\",\n      \"Read(./.env.*)\",\n      \"Bash(git push *)\"\n    ],\n    \"ask\": [\n      \"mcp__mail__send_message\"\n    ]\n  }\n}"]],"warn":"設定を変えたら、止めたい操作をわざと頼んで本当に止まるか確かめる。Windows ではサンドボックスがそのままでは効かないので、deny ルールとフックで守る前提で考える。","quiz":[{"q":"allow に Bash(git *)、deny に Bash(git push *) がある。Claude が git push を実行しようとしたら？","o":["allow が先に書いてあるので、確認なしで実行される","deny が先に見られるので、止められる","後から足したルールが勝つので、足した順で決まる","ask のルールがないので、毎回確認が出る"],"a":1,"e":"ルールは deny → ask → allow の順に見て、最初に当たったもので決まる。書いた順や細かさは関係ないので、広い allow があっても deny が勝つ。"},{"q":"CLAUDE.md に「.env は読まないで」と書いたが不安。Claude Code の仕組みで確実に止めるには？","o":["CLAUDE.md の先頭に、太字で書き直しておく",".claudeignore というファイルに .env と書く","Plan モードにして、読む作業だけさせる","deny に Read(./.env) を足す"],"a":3,"e":"権限ルールは Claude Code 本体が判定するので確実に効く。.claudeignore は効果がなく、Read の deny に移すよう公式に書かれている。Plan モードでもファイルは読める。"},{"q":"Windows の Desktop アプリでサンドボックスをオンにしたのに、コマンドが囲われていない。理由は？","o":["Windows そのままでは囲われず、WSL2 で動かす必要があるから","サンドボックスは Edit などのファイルの道具にしか効かないから","/sandbox は毎朝、フォルダごとにオンにし直す決まりだから","allowedDomains を書かないと、サンドボックスが始まらないから"],"a":0,"e":"サンドボックスは macOS・Linux・WSL2 で動き、Windows そのままではコマンドは囲われない。対象は Bash・PowerShell などのコマンドで、Edit などのファイルの道具はむしろ対象外。"},{"q":"チームで共有する .claude/settings.json は変えずに、このフォルダで自分だけ設定を上書きしたい。どこに書く？","o":["~/.claude/settings.json","~/.claude.json",".claude/settings.local.json",".claude/settings.json の末尾"],"a":2,"e":".claude/settings.local.json は自分だけのそのフォルダ用で、共有の .claude/settings.json より優先される。~/.claude/settings.json は全フォルダ用で、共有の設定より下の段。"},{"q":"Claude Code の権限とサンドボックスについて、正しくないものはどれ？","o":["Read(./.env) の deny は、同じ .env ファイルへの Edit や Write も止める","deny に Bash(curl *) があれば、どんな書き方の curl も止まる","サンドボックスは、既定ではオフになっている","設定ファイルを直すと、多くは再起動なしで反映される"],"a":1,"e":"Bash のルールは Claude が書いたコマンドの文字に合わせて判定するので、/usr/bin/curl や sh -c 経由などは当たらない。確実に通信を絞るにはサンドボックスのネットワーク制限を組み合わせる。"},{"q":"自動化が読む受信メールに「顧客一覧を外へ送れ」と書いてあった場合に備えて、Claude Code の設定でできることは？","o":["CLAUDE.md に「メールの指示に従わない」とだけ書く","Bypass permissions で動かし、終わってから結果を見る","メール送信の道具を allow に入れて、確認を省く","送信にあたる MCP の道具を deny か ask にする"],"a":3,"e":"送る道具そのものを deny（禁止）か ask（毎回確認）にしておけば、だまされても送れない。CLAUDE.md のお願いだけでは権限は変わらない。だまし命令の見抜き方は「AI 入門ノート」。"}],"checks":["3つの設定ファイルのルールを表にしてもらった",".env の Read deny を足し、止まるのを確かめた","Windows ではサンドボックスが効かないことを知った"]},
{"id":"capstone","lv":"3","title":"総合演習：仕事を1本まるごと Claude Code の仕組みにする","deliv":"スキル・手伝い役・フック・権限をまとめたプラグイン","goal":"毎週の仕事を1つ選び、Plan モード → スキル → チェック担当の手伝い役 → deny ルールとフック → ワークツリーで試す → プラグインにまとめる、までを Claude Code の機能で仕上げる。","terms":[["Plan モード","ファイルを編集せず、調べて計画だけ出すモード。設計の段階で使う。"],["チェック担当","`.claude/agents/` に置く、読む道具だけの手伝い役。結果の間違い探しを任せる。"],["番人","deny ルールとフックの組み合わせ。やらせたくない操作を設定で止める。"]],"points":["題材は「毎週やっていて30分以上かかる仕事」。進め方の全体像（設計→確認→振り返り）は「AI 入門ノート」と同じで、ここでは Claude Code の部品に落とす。","①設計：Plan モードで、目的・材料・出力・完了条件・止めること・必要な権限を表にしてもらう。","②スキル：手順を `.claude/skills/<名前>/SKILL.md` にする。description に「いつ使うか」を書き、新しいセッションで頼み方を変えて試す。","③チェック担当：`.claude/agents/checker.md` に `tools: Read, Grep, Glob` で作る。書き換えさせない。","④番人：秘密や本番ファイルは deny、送信・削除は ask か deny。毎回必ず走らせたい確認はフック。","⑤試す：Worktree をオンにしたセッションで作って動かし、Changes で差分を見てから本体にまとめる。","⑥まとめ：スキル・手伝い役・フックを1つのプラグインにまとめ、`--plugin-dir` で試してから version をつけて保管する。"],"steps":["題材を1つ決め、Plan モードで設計表を出してもらう。","スキルとチェック担当の手伝い役を作ってもらう。","deny ルールとフックで番人を作り、わざと止めたい操作を頼んで試す。","Worktree のセッションで1回通しで動かし、差分を確かめる。","プラグインにまとめて --plugin-dir で試し、振り返りを保管庫に残す。"],"asks":[["毎週月曜の売上まとめを、Claude Code の仕組みにしたい。Plan モードで、目的、材料、出すもの、完了の条件、やっちゃいけないこと、それぞれに使う Claude Code の部品（スキル、手伝い役、フック、deny ルール）を表にして。まだ何も作らないで。","毎週月曜の売上まとめを仕組み化したい。Plan モードで目的・材料・出力・完了条件・禁止事項と、対応する部品（スキル／サブエージェント／フック／deny）を表に。まだ作らないで。"],["できたスキルとチェック担当とフックを、sales-kit っていうプラグインにまとめて。--plugin-dir で読み込んで、/sales-kit: から始まる名前でスキルが呼べるか一緒に確かめて。","スキル・checker・フックをプラグイン sales-kit にまとめ（version 1.0.0）、--plugin-dir で読み込み、/sales-kit:〜 で呼べるか確認して。"]],"files":[["設計表の例","| 項目 | 内容 | Claude Code の部品 |\n|------|------|------|\n| 手順 | CSV を集計して表にする | スキル weekly-sales |\n| 確認 | 合計と件数を見直す | 手伝い役 checker（Read, Grep, Glob） |\n| 禁止 | 元の CSV を書き換えない | deny Edit(./data/raw/**) |\n| 毎回 | 終わったら検算スクリプト | フック Stop |"]],"warn":"部品が増えるほど、どこで何が動いているか分かりにくくなる。/hooks・/mcp・/agents で一覧を見て、使っていないものは外す。","quiz":[{"q":"設計の段階では、まだファイルを作らせたくない。Claude Code の使い方として一番合うのは？","o":["Accept edits モードで、計画書のファイルだけ書いてもらう","Manual モードにして、確認が出たらすべて断る","Plan モードで、目的・材料・完了条件を表にしてもらう","Bypass permissions で、一気に下書きまで作ってもらう"],"a":2,"e":"Plan モードはソースのファイルを編集せず、調べて計画を出すモード。Manual で全部断っても止まるが、毎回の確認に答える手間が増え、計画づくりに向かない。"},{"q":"本体のフォルダを汚さずに、自動化を1回通しで試したい。どうする？","o":["Worktree をオンにしたセッションで作って試す","本体のフォルダで作り、壊れたら /rewind で戻す","Plan モードのまま、実際に集計まで動かして試す","チェック担当の手伝い役に、本体のファイルを直させる"],"a":0,"e":"ワークツリーは作業用コピーなので、本体に影響を出さずに試せる。/rewind は Bash で作られたファイルや手伝い役の編集を戻せないことがあるので、試しの場には向かない。"},{"q":"チェック担当がうっかり集計表を書き換えないようにしたい。一番確実な設定は？","o":["checker.md の本文の最初に「集計表は絶対に書き換えないで」と書く","checker.md の tools を Read, Grep, Glob にする","checker.md の model を haiku にしておく","checker.md の description を短く書き直す"],"a":1,"e":"tools に読む道具だけを書けば、書き換える道具そのものが渡らない。本文の「しないで」はお願いで、仕組みとして止めるものではない。"},{"q":"集計が終わるたびに、検算スクリプトを必ず走らせたい。どの部品を使う？","o":["CLAUDE.md に「毎回検算して」と書いておく","スキルの description に「検算する」と書き足す","Plan モードにして、毎回検算をお願いする","Stop フックで、検算スクリプトを動かす"],"a":3,"e":"フックは決まったタイミングで毎回必ず動く。CLAUDE.md やスキルの説明は Claude への案内なので、忘れられることがある。"},{"q":"仕組みをプラグインにまとめるときの話で、正しくないものはどれ？","o":["まとめれば、Cloud のセッションでもそのまま動く","スキル・手伝い役・フックを1つにまとめられる","スキルは /プラグイン名:スキル名 で呼べる","version を上げないと、仲間は前の版のまま"],"a":0,"e":"Cloud のセッションはローカルで入れたプラグインを読まない。Cloud で同じことをしたいなら、リポジトリの .claude/settings.json などに必要なものを入れる。"},{"q":"集計スクリプトは API キーの入った .env を読む必要がある。でも Claude には中身を見せたくない。どうする？","o":[".env を消して、キーを CLAUDE.md に書いておく","Read(./.env) を deny にするとスクリプトも動かなくなるので、守るのは諦める","Read(./.env) を deny にする。スクリプトが自分で読むのは止まらない",".env を allow に入れて、Claude にもスクリプトにも読ませる"],"a":2,"e":"Read の deny は Claude の道具や cat などのコマンドに効き、スクリプトが自分で開くファイルは止めない。だから「Claude は見ない、スクリプトは使える」が両立する。"}],"checks":["Plan モードで設計表を作った","スキル・チェック担当・番人を作って試した","プラグインにまとめて --plugin-dir で確かめた"]}

const EXAMS={"1":[{"q":"ターミナル版の Claude Code で、長く話し合いながら直してもらったら、頼んでいない2つのファイルまで書き換わっていた。話し合いの中身は残して、ファイルだけ元に戻したい。","o":["/clear して、新しいセッションで最初からやり直す","/compact で会話を短くしてから「元に戻して」と頼む","/rewind でその頼みごとを選び、コードだけ戻す","/resume で前のセッションを開き直して続ける"],"a":2,"e":"「コードだけ戻す（Restore code）」は、Claude が編集ツールで変えたファイルを選んだ時点に戻し、会話は残す。/clear や /resume は会話を切り替えるだけで、ファイルは戻らない。","refs":["plan-checkpoint","session"]},{"q":"Auto モードで作業させたら、Claude がコマンドで古いフォルダを消していて、/rewind でも戻らなかった。次から確実に防ぐ設定は？","o":["CLAUDE.md に「ファイルは消さない」と書いておく","チェックポイントの保存期間を長くする設定にする","毎回の頼みごとの最後に「消さないで」と添える","settings.json の deny に Bash(rm *) を入れる"],"a":3,"e":"コマンドでの削除はチェックポイントの対象外なので、起きる前に deny で止める。CLAUDE.md や頼みごとの一言はお願いなので、確実ではない。","refs":["safety","plan-checkpoint"]},{"q":"長い会話で決めた「ToDo の期限は月/日」が、/clear 後の会話で守られない。これからは毎回効かせたい。","o":["プロジェクトの CLAUDE.md に書いてもらう","次からは /compact に「期限の決まりを残して」と添えて要約する","/resume で前の会話に戻ってから頼む","/rename で会話に名前をつけておく"],"a":0,"e":"CLAUDE.md は新しいセッションでも毎回読まれる。/compact の指示はその要約にしか効かず、/clear 後の会話には残らない。","refs":["session","memory"]},{"q":"CLAUDE.md が300行を超え、その大半が議事録の手順。毎回の読み込みを軽くしたい。","o":["手順を別ファイルにして、CLAUDE.md から @ で取り込む形にする","議事録の手順をスキルに移す","CLAUDE.md の名前を CLAUDE.local.md に変える","手順を自動メモリの MEMORY.md に移しておく"],"a":1,"e":"スキルはふだん description だけが読まれ、本文は使うときに読まれる。@ の取り込みは CLAUDE.md と一緒に読まれるので、量は減らない。","refs":["memory","skill-basic"]},{"q":"「お知らせ公開」スキルを作った。Claude が勝手に使わないようにし、さらに git push の前には必ず確認を挟みたい。","o":["user-invocable: false と、deny に Bash(git push *) を入れておく","description を空にして、Auto モードで動かす","disable-model-invocation: true と、ask に Bash(git push *)","CLAUDE.md に「勝手に公開しない」と書き、Bypass permissions で動かす"],"a":2,"e":"disable-model-invocation: true で自分が呼んだときだけ動き、ask なら push の前に毎回聞かれる。user-invocable: false は自分の / 一覧から隠れる設定で、deny だと push 自体ができなくなる。","refs":["skill-basic","safety"]},{"q":"Drive の30件の移動を頼む前に案を見たい。実行後、まずかった1件だけを戻したい。","o":["Auto で一気に実行し、まずい1件は /rewind の「コードだけ戻す」で戻す","Accept edits で実行し、Changes の差分から元に戻す","Manual で実行し、/clear で取り消す","Plan で案を確かめ、戻すときは Claude に移し直しを頼む"],"a":3,"e":"Drive の中の操作は こから要約する（Summarize from here）」を選んだ。どうなる？","o":["その時点から後のファイルの変更も、まとめて取り消される","要約された部分の会話は完全に消え、Claude は細部をもう参照できなくなる","その時点から後の会話が要約され、ファイルはそのまま","セッションが2つに分かれ、元の会話は別のセッションとして残る"],"a":2,"e":"要約はファイルを変えず、会話を短くしてコンテキストを空けるだけ。元のメッセージは記録に残る。セッションを分けるのは /branch のほう。","refs":["plan-checkpoint","session"]},{"q":"午後の仕事は午前と関係ない。午前の会話もあとで見返したい。Code タブでいちばん合う操作は？","o":["同じセッションで /compact してから、午後の仕事を続けて頼む","同じセッションで /rewind を使い、最初の頼みごとまで戻す","環境を Cloud に変えて、同じセッションで続ける","サイドバーの「+ New」で新しいセッションを開く"],"a":3,"e":"新しいセッションなら午前の話が混ざらず、午前のセッションもサイドバーに残る。/compact は午前の話を要約して残すので、引きずりやすい。","refs":["session","start"]},{"q":"アプリのモード選択で Plan を選んで作業した。翌日、新しいセッションを開いたときのモードは？","o":["Plan は引き継がれず、ふだんの開始モードで始まる","Plan が設定に保存されて、次からずっと Plan で始まる","前日の最後のセッションのモードがそのまま続く","CLAUDE.md に書いたモードで始まる"],"a":0,"e":"アプリで選んだ Plan は、そのセッションだけに効く。毎回の開始モードを変えたいなら設定の defaultMode で決める。","refs":["plan-checkpoint","safety"]},{"q":"新しいセッションを始めたとき、自動で読み込まれるものの組み合わせは？","o":["前のセッションの会話の全文と、CLAUDE.md","CLAUDE.md と、MEMORY.md の先頭部分","すべてのスキルの本文と、すべての自動メモリのファイル","これまでのチェックポイントの一覧と、settings.json の中身"],"a":1,"e":"CLAUDE.md と自動メモリの目次 MEMORY.md（先頭200行か25KB）は毎回読まれる。スキルはふだん description だけで、前の会話は入らない。","refs":["memory","session"]},{"q":"保管庫の .claude/skills/ にある「メモ整形」スキルを、ほかのプロジェクトでも使いたい。いちばん合うのは？","o":["ほかのプロジェクトの CLAUDE.md に、スキルの名前を書いておく","自動メモリにスキルの中身を覚えさせる","~/.claude/skills/ に移して自分全体用にする","毎回、保管庫をプロジェクトフォルダとして開き直してから使う"],"a":2,"e":"ホームの .claude/skills に置いたスキルは全プロジェクトで使える。CLAUDE.md に名前を書いても、スキルそのものは読み込まれない。","refs":["skill-basic","obsidian"]},{"q":"コネクタをいくつもつないだら、使用量が心配になった。Claude Code の仕組みとして正しいのは？","o":["つないだだけで、全部のツールの説明が毎回すべて読み込まれ続ける","コネクタの使用量はプランの枠とは別に請求される","/effort を下げれば、コネクタの読み込みはなくなる","ツールの中身は使うまで読み込まれないが、不要なものは /mcp で止める"],"a":3,"e":"MCP のツールの説明は標準で後から読み込まれ、最初は名前などだけが入る。それでも触れる範囲は広がるので、使わないものは /mcp で無効にする。","refs":["connect","usage"]},{"q":"むずかしい方針を決める大事な作業。手戻りで使用量をむだにしたくない。いちばん合う組み合わせは？","o":["上位のモデルで、Plan で計画を確かめてから実行","軽いモデルで、Auto モードで一気に実行して何度かやり直す","/effort を最低にして、Bypass permissions で実行する","中くらいのモデルで、計画なしで実行し /rewind で何度も戻す"],"a":0,"e":"むずかしい判断は上位のモデルが向き、Plan で方向を先に確かめれば高くつく手戻りを防げる。/rewind で何度も戻すと、そのたびの作業分の使用量がむだになる。","refs":["plan-checkpoint","usage"]},{"q":"Gmail をつないで、Auto モードで作業させる。Claude Code の Auto の仕組みとして正しいのは？","o":["Auto にすると、settings.json の deny ルールは無視される","機密を外へ送るような操作は、標準で止める対象になっている","Auto はどんな操作も止めないので、Bypass permissions と同じ","Auto ではコネクタは読むだけになり、送信は一切できない"],"a":1,"e":"Auto は別の AI が動作を見て、機密データを外へ送る操作などを標準で止める。deny も効く。ただし公式も安全の保証まではしていない。","refs":["safety","connect"]}],"2":[{"q":"予約タスク inbox-check の下書きに、毎回余計な一文が入る。中身を直すいちばん良い場所は？","o":["タスクを Delete して、新しい頼み方で作り直す","~/.claude/skills に同じ名前のスキルを作って上書きする","inbox-check の SKILL.md の上のほうに禁止事項を足す","CLAUDE.md に「下書きに余計な一文を入れない」と書く"],"a":2,"e":"予約タスクの頼みごとは scheduled-tasks の SKILL.md にあり、直すと次の実行から効く。大事な決まりは上のほうに置く。作り直しは手間が増え、許可の設定もやり直しになる。","refs":["schedule","skill-grow"]},{"q":"毎月の経費集計をスキルにする。毎回合計を正確に出し、しかも場所（トークン）を食わせたくない。合う作り方は？","o":["集計のプログラムを scripts/ に入れ、SKILL.md から実行させる","計算の手順を SKILL.md にくわしく書き、毎回それを読ませて計算させる","過去の CSV を全部 example として同じフォルダに入れる","description に「正確に計算する」と書き足しておく"],"a":0,"e":"scripts/ のプログラムは中身を読み込まずに実行だけされるので、正確で場所も食わない。手順をくわしく書いても、Claude が頭で計算することに変わりはない。","refs":["accounting","skill-make"]},{"q":"作業フォルダを git 管理にしたあと .env を作り、deny に Read(./.env) も入れた。GitHub に push する前に、必ず確かめることは？","o":["deny の Read(./.env) が、ask より上に書かれているか","settings.local.json が .gitignore に入っているか","push の ask ルールが allow より上に書かれているか",".env が .gitignore に入り、記録から外れているか"],"a":3,"e":"deny は Claude の読み取りを止めるだけで、git の記録には関係ない。.env が .gitignore に入っていないと、キーがコミットされ外に送られる。ルールの判定順は書いた位置では変わらない。","refs":["apikey","git"]},{"q":"Claude がファイルを直したうえ、PowerShell の一括処理もしたら、あちこち壊れた。昨夜コミット済みで、そのときは動いていた。いちばん確実な戻し方は？","o":["/rewind で今朝の頼みごとを選び、Restore code する","昨夜のコミットの状態に、git で戻してもらう","/compact で要約してから、直し方を考え直させる","/clear して、/resume で昨夜のセッションを開く"],"a":1,"e":"コマンドで変えたファイルはチェックポイントでは戻らないので、全部を確実に戻すならコミット。/resume で会話を開いても、ファイルは戻らない。","refs":["recover","git"]},{"q":"HTML レポートを作るたびに見た目がバラバラ。いちばん手間が少なく、毎回そろう方法は？","o":["レポートを頼むたびに、色とフォントを声で細かく伝える","CLAUDE.md に @DESIGN.md と書き、Browser ペインで仕上がりを確かめる","前回のレポートの HTML を、毎回チャットに貼って「同じ見た目で」と頼む","CLAUDE.md に、色のカラーコードを全部書き込んで200行を超えても残す"],"a":1,"e":"@ で読み込めば毎回ルールが一緒に読まれ、Browser ペインですぐ確かめられる。CLAUDE.md を長くすると守られにくくなる。","refs":["report","design"]},{"q":"毎朝の予約タスクで、3日続けて Slack に「失敗した」と届いた。最初にやることは？","o":["タスクを Delete して、同じ内容で作り直す","頻度を Weekdays から Hourly に変えて、回数を増やす","詳細画面の History から各実行のセッションを開き、何が起きたか見る","権限モードを Bypass permissions に変えて、しばらく様子を見る"],"a":2,"e":"History から実行のセッションを開けば、Claude が何をして、どこで止まったか見られる。原因が分からないまま作り直しや権限の変更をしても、同じ失敗が続きやすい。","refs":["schedule","recover"]},{"q":"入れたプラグインの MCP サーバーが「設定が必要」と表示された。キーの入力が要るらしい。扱いとして正しいのは？","o":["Installed の Configure を開き、自分で入力する","キーをチャットに貼って、プラグインの設定ファイルに書いてもらう","音声入力で読み上げて、Claude に設定してもらう","CLAUDE.md にキーを書いて、プラグインから読ませる"],"a":0,"e":"同梱の MCP サーバーの設定は Installed タブの Configure で行う。チャットや声、CLAUDE.md に出したキーは記録に残り、読み込まれる。","refs":["plugin-use","apikey"]},{"q":"プロジェクト用スキル（.claude/skills）を直したら大事な手順が消えた。このフォルダは git 管理で、直す前にコミット済み。最も良い対応は？","o":["/skills の一覧から、そのスキルを Disable にする","消えた手順を思い出して、SKILL.md に書き足してもらう","新しいセッションで3通り試して、しばらく様子を見る","差分で消えた行を確かめ、前のコミットの版に戻してから直し直す"],"a":3,"e":"差分とコミットがあれば、消えた手順も含めて確実に戻せる。思い出して書き足す方法では、ほかにも消えた所があっても気づけない。","refs":["git","skill-grow"]},{"q":"自作のスキル3つとコネクタの設定を、別々のリポジトリで働く複数の同僚に一式で使ってもらいたい。合うやり方は？","o":["3つとも ~/.claude/skills に個人用スキルとして置き直す","プラグインにまとめ、マーケットプレイスから入れてもらう","CLAUDE.md に3つのスキルの中身を書き写して配る","3つの SKILL.md を1つの大きな SKILL.md にまとめる"],"a":1,"e":"スキルや MCP の設定を道具箱にして配るのがプラグイン。~/.claude/skills は自分のPCで使えるだけで、同僚には届かない。","refs":["skill-make","plugin-use"]},{"q":"毎月1日に経費を集計して Slack に送る予約タスクを作る。正しくないものはどれ？","o":["クラウドのタスクにすれば、PCのフォルダにある CSV もそのまま読める","会計の CSV を使うなら、ローカルのタスクにしてフォルダを選ぶ","作ったらまず Run now で1回動かし、確認に答えておく","頼みごとの本文に、送金や送信をしない一文を入れておく"],"a":0,"e":"クラウドのタスクは Anthropic 側で動くので、PCのフォルダは読めない。ローカルのファイルを使うならローカルのタスクにする。","refs":["schedule","accounting"]},{"q":"HTML レポートを3回直してもらったが、2回前の版のほうが良かった。会話はそのまま残したい。合うのは？","o":["/clear して、2回前の頼み方をもう一度送る","/compact に「2回前の版に戻して」と添える","/rewind で2回前を選び、Restore code する","/branch で枝分かれさせ、そちらで2回前の版を作り直してもらう"],"a":2,"e":"Restore code はファイルだけを選んだ地点に戻し、会話は残す。/compact は会話を要約するだけで、ファイルは変えない。","refs":["report","recover"]},{"q":"DESIGN.md を大きく変えて試したい。今のルールで作った資料も残したい。安全なのは？","o":["/branch で会話を枝分かれさせ、そちらで DESIGN.md を書き換える","/rewind に頼れば戻せるので、本体の DESIGN.md を直接書き換える","CLAUDE.md の @ を DESIGN2.md に向け、2つのファイルで切り替える","git の新しいブランチで DESIGN.md を変えて試し、良ければ取り込む"],"a":3,"e":"git のブランチなら本体のファイルはそのままで試せる。/branch は会話を分けるだけで、ファイルは同じものを書き換えてしまう。","refs":["git","design"]},{"q":"deny で .env の読み取りを止めているのに、画像生成のエラーを調べる Claude が、フォルダ全体を文字で検索するコマンドを出そうとした。どうする？","o":["deny があるので心配はなく、そのまま OK してよい","その実行は断り、.env を外した範囲で調べてもらう","調べるあいだだけ deny を消して、終わったら戻す","/rewind でひとつ前に戻り、同じことを頼み直す"],"a":1,"e":"deny はファイル名を書かないフォルダ全体の検索までは止められない。確認の画面で断り、範囲を絞ってもらう。deny を一時的に消すと、その間は読み放題になる。","refs":["apikey","recover"]},{"q":"毎回同じ型のマニュアルを作りたい。手間が少なく、仕上がりがそろう方法は？","o":["template.md をスキルに入れ、SKILL.md から参照する","頼むたびに「前と同じ形で」と添え、前の会話を /resume で開いておく","CLAUDE.md に、うまくできたマニュアルの全文を貼っておく","/compact に「マニュアルの型だけ残して」と添えて会話を続ける"],"a":0,"e":"型をスキルの付属ファイルにすれば、新しいセッションでも毎回同じ型で作れる。CLAUDE.md に全文を貼ると毎回の場所を食い、守られにくくなる。","refs":["report","skill-make"]},{"q":"プラグインを入れてから、ファイルを保存するたびに知らない処理が勝手に動く。最初にやることは？","o":["deny を増やして、知らない処理を止める","/rewind で入れる前の地点に戻し、Restore code する","Disable して、hooks/hooks.json の中身を見る","/compact で会話を要約して、処理を忘れさせる"],"a":2,"e":"操作の前後に勝手に動くのはフックで、許可ルールの外で動く。まず止めてから、何を動かしていたか hooks.json で確かめる。/rewind はプラグインの導入を取り消さない。","refs":["plugin-use","recover"]},{"q":"請求書の HTML だけは、毎回同じ見た目のルールで作りたい。ほかの作業では読み込ませたくない。合う置き方は？","o":["~/.claude/CLAUDE.md に請求書のルールを書く",".claude/rules/invoice.md に paths で invoices/** を書く","settings.json の deny に invoices/** 以外を書く","請求書のルールを CLAUDE.local.md に書く"],"a":1,"e":"paths 付きのルールは、合うファイルを扱うときだけ読まれる。~/.claude/CLAUDE.md は全プロジェクトで毎回読まれる。","refs":["accounting","design"]},{"q":"git と Claude Code の設定について、正しくないものはどれ？","o":["コミット済みの .env も、deny に Read(./.env) を足せば履歴から消える",".env は自動では git の対象から外れないので、.gitignore に入れる","push の前に必ず聞かせるなら、ask に Bash(git push *) を書く","チェックポイントのファイルの控えは、一定の期間がたつと消える"],"a":0,"e":"deny は Claude の読み取りを止めるだけで、git の履歴には何もしない。コミットしてしまったキーは無効化して作り直す。","refs":["git","apikey"]},{"q":"CLAUDE.md が400行にふくらみ、チラシ作りの細かい手順が守られにくくなった。手順の移し先として合うのは？","o":["DESIGN.md の最後に、チラシの手順をまとめて書き足す","settings.json の permissions の欄に、手順を書き込む","CLAUDE.md のまま、大事な行を太字にして目立たせる","チラシ用のスキルにして、色は DESIGN.md を参照させる"],"a":3,"e":"何手順もある作業はスキルに移すと、使うときだけ本文が読まれる。CLAUDE.md は200行以内が目安で、太字にしても長さの問題は残る。","refs":["design","skill-grow"]},{"q":"集計表の合計が検算と合わない。「直して」と頼んだら、Claude が合計の数字だけ書き換えてきた。どうする？","o":["合計が合ったので、そのまま完了にする","/compact で会話を要約してから、もう一度「合計を直して」と頼む","Restore code で戻し、原因を調べてスクリプトで計算させる","/clear して、まったく同じ頼み方でもう一度作ってもらう"],"a":2,"e":"数字だけ合わせた版はファイルごと戻し、ずれの原因を確かめてから計算はスクリプトに任せる。同じ頼み方でやり直すと、同じずれがまた出やすい。","refs":["accounting","recover"]},{"q":"予約タスクで、プラグインに入っているコネクタを使っている。クラウドのタスクに切り替えたら、そのコネクタが使えなくなった。理由は？","o":["クラウドのタスクは、1日1回しか動かせない決まりだから","プラグインは、クラウドのセッションでは読み込まれないから","クラウドのタスクは、Bypass permissions でしか動かないから","プラグインは、予約タスクの SKILL.md に書かないと使えないから"],"a":1,"e":"プラグインはクラウドのセッションでは使えない。PCのプラグインやファイルを使う仕事はローカルのタスクにする。","refs":["schedule","plugin-use"]}],"3":[{"q":"動画の書き出しが終わったら通知したい。ffmpeg を実行した後だけに絞るフックの書き方は？","o":["Stop フックの matcher に \"ffmpeg\" と書く","PreToolUse の matcher \"Bash\"、if に Bash(ffmpeg *) と書く","PostToolUse の matcher \"Bash\"、if に Bash(ffmpeg *)","SessionStart の matcher に \"ffmpeg\" と書く"],"a":2,"e":"コマンドを使った直後は PostToolUse。道具名 Bash を matcher に、if で ffmpeg のコマンドだけに絞る。PreToolUse は実行前なので「終わった」通知にならない。","refs":["video","hooks"]},{"q":"文字起こし済みの長いテキストから区間リストを作る作業を手伝い役に任せたい。ファイルを書き換えさせない定義は？","o":["tools を Read, Grep, Glob だけにする","tools を省き、本文に「書き換えないで」と書いておく","model を haiku にして、軽い読む作業だと伝えておく","description に「書き換えない」と書いておく"],"a":0,"e":"tools に読む道具だけを並べれば、書き換える道具が渡らない。tools を省くとほぼすべての道具を引き継いでしまう。","refs":["video-edit","subagent"]},{"q":"3つの手伝い役に、同じフォルダの別々のファイルを同時に直させたい。変更のぶつかりを避けるには？","o":["手伝い役ごとに model を別々にしておく","手伝い役ごとに Code タブのセッションを開く","Plan モードにしてから手伝い役を動かす","手伝い役の定義に isolation: worktree を入れる"],"a":3,"e":"isolation: worktree をつけた手伝い役は、それぞれ自分のワークツリーで作業する。model を変えても同じフォルダを触ることは変わらない。","refs":["subagent","parallel"]},{"q":"公開用フォルダを守る PreToolUse フックのスクリプトが、書き間違いで exit 1 で終わっていた。編集はどうなった？","o":["止まった。0 以外ならどの数字でも止まる","続いた。フックのエラーが表示されるだけ","Claude Code ごと止まり、セッションが閉じた","次のセッションから止まるようになる"],"a":1,"e":"止める合図は exit 2 だけ。exit 1 は止まらないエラー扱いで、操作は続く。確実に止めたいなら deny ルールも合わせて書く。","refs":["hooks","security"]},{"q":"仲間と共有している .mcp.json のサーバーで、削除の道具を全員に禁止したい。どこに何を書く？","o":["~/.claude/settings.json の deny に mcp__svc__delete_item",".mcp.json の中に deny: delete_item と書く",".claude/settings.json の deny に mcp__svc__delete_item",".claude/settings.local.json の allow から外しておく"],"a":2,"e":"全員に効かせるなら共有の .claude/settings.json。~/.claude/settings.json は自分だけで、.mcp.json は接続の設定なので許可・禁止は書けない。","refs":["mcp","security"]},{"q":"my-office-kit プラグインに入れた MCP サーバー svc の delete_item を deny で止めたい。道具の名前は？","o":["mcp__plugin_my-office-kit_svc__delete_item","mcp__svc__delete_item","my-office-kit:svc:delete_item","plugin__my-office-kit__delete_item"],"a":0,"e":"プラグインに入ったサーバーの道具は mcp__plugin_プラグイン名_サーバー名__道具名 になる。ふつうの mcp__svc__ の形では当たらない。","refs":["mcp","plugin-share"]},{"q":"自分のフックをプラグインに入れて配りたい。フックの設定はどこに置く？","o":[".claude-plugin/hooks.json","プラグイン直下の hooks/hooks.json","プラグイン直下の settings.json","skills/hooks/SKILL.md"],"a":1,"e":"プラグインのフックは hooks/hooks.json に、設定ファイルの hooks と同じ形で書く。.claude-plugin/ の中には plugin.json しか入れない。","refs":["plugin-share","hooks"]},{"q":"Windows で、ワークツリーのセッション中に Bash の確認で「Yes, and don't ask again」を選んだ。その許可は？","o":["本体と全部のワークツリーで共有される","そのセッションが終わると消えてしまう","~/.claude/settings.json に入り、全プロジェクトで効く","そのワークツリー側に残り、本体には効かない"],"a":3,"e":"ふだんは本体の .claude/settings.local.json に保存されて全ワークツリーで効くが、Windows ではそのワークツリー側に残る。本体でも同じ確認が出るのはこのため。","refs":["parallel","security"]},{"q":"Desktop のワークツリーセッションで動くフックの ${CLAUDE_PROJECT_DIR} は、どこを指す？","o":["そのワークツリーのフォルダ","~/.claude フォルダ","Cloud 側の作業フォルダ","本体（メインのフォルダ）の一番上"],"a":3,"e":"Desktop のワークツリーセッションでは、フックは本体の一番上で動き、${CLAUDE_PROJECT_DIR} もそこを指す。ワークツリーの場所は入力 JSON の cwd で受け取る。","refs":["parallel","hooks"]},{"q":"Desktop のワークツリーセッションで、CLAUDE.md とスキルはどこから読まれる？","o":["どちらもワークツリーから読まれる","どちらも本体のフォルダから読まれる","CLAUDE.md はワークツリー、スキルや設定は本体から","CLAUDE.md は本体、スキルはワークツリーから"],"a":2,"e":"Desktop のワークツリーでは、設定・フック・スキル・手伝い役・.mcp.json は本体の一番上から読み、CLAUDE.md はワークツリーから読む。","refs":["parallel","capstone"]},{"q":"Windows で元動画を守りたい。現実的な組み合わせは？","o":["deny に Edit(./raw/**) を書けば、ffmpeg も含めて全部止まる","deny で Claude の編集を止め、ffmpeg の出力先は別フォルダと決める","サンドボックスをそのまま有効にして、raw への書き込みを止める","CLAUDE.md に「raw は上書きしない」と書いておけば十分"],"a":1,"e":"Edit の deny は Claude の道具には効くが、ffmpeg が自分で書くファイルは止めない。Windows そのままではサンドボックスも効かないので、出力先を分ける運用と組み合わせる。","refs":["video-edit","security"]},{"q":"作ったスキルの文章を、会話を汚さず、書き換えもさせずにチェックしてほしい。どうする？","o":["メインの会話で、自分で頭から読み直す","general-purpose の手伝い役に、気づいた点を直してもらう","Plan モードにして、メインの会話の中で確かめてもらう","tools を Read, Grep にした checker に任せる"],"a":3,"e":"読む道具だけの手伝い役なら、別の枠で読んで結果だけ返し、書き換えもできない。general-purpose はすべての道具を持つので直してしまう。","refs":["capstone","subagent"]},{"q":"スキルをプラグインにまとめたが、元の .claude/skills/minutes も消していない。どうなる？","o":["元の .claude/skills のスキルは自動で消される","プラグインのほうが読み込まれなくなる","名前がぶつかり、両方とも使えなくなる","両方が使える（/minutes と前置きつき）"],"a":3,"e":"プラグインのスキルには前置きがつくので、元のスキルとぶつからず両方残る。動くのを確かめたら元のほうを消す。","refs":["capstone","plugin-share"]},{"q":"動画づくりのプラグインを仲間に配った。仲間が Cloud 環境のセッションで使おうとしたら出てこない。理由は？","o":["version を上げずに配ったから","スキル名に日本語を使ったから","Cloud はローカルのプラグインを読まないから","SKILL.md が .claude-plugin/ の外にあるから"],"a":2,"e":"Cloud のセッションは自分の PC で入れたプラグインを読まない。SKILL.md が .claude-plugin/ の外にあるのは正しい形。","refs":["video","plugin-share"]},{"q":"毎週の自動化で、MCP の道具が大きな表を返して警告が出た。まずやることは？","o":["MCP サーバーを入れ直して、つなぎ直す","必要な列だけ返すよう頼み方を直す","毎回 /compact をかけてから続ける","サンドボックスをオンにして囲う"],"a":1,"e":"出力が大きいと会話の枠を圧迫するので、まず返す量を減らす。上限は MAX_MCP_OUTPUT_TOKENS で変えられるが、上げるのは最後の手段。","refs":["mcp","capstone"]},{"q":"ターミナル版の Claude Code で deny ルールを足したのに、効いていない気がする。そのルールがどの設定から来ているかを確かめるには？","o":["/permissions を開き、ルールとその出どころを見る","/hooks を開いて、設定ファイルごとのフックを確かめる","/mcp を開いて、つないだサーバーの接続を確かめる","/agents を開いて、手伝い役の定義を確かめる"],"a":0,"e":"/permissions は許可・確認・禁止のルールを、どの設定（スコープ）から来たかごとに見せてくれる。/hooks はフックの一覧で、許可ルールは出ない。","refs":["security","capstone"]},{"q":"チェック担当の手伝い役だけに効くフックをつけたい。どこに書く？","o":[".claude/settings.json の matcher に \"checker\"","~/.claude/settings.json の SubagentStart","CLAUDE.md の中にフックの JSON を書く","手伝い役の定義（先頭の設定）の hooks"],"a":3,"e":"手伝い役の定義ファイルの先頭（frontmatter）に hooks を書くと、その手伝い役の間だけ動く。設定ファイルの matcher は道具の名前に当てるもの。","refs":["hooks","subagent"]},{"q":"Desktop のワークツリーセッションで、.mcp.json のサーバーはどこから読まれる？","o":["ワークツリーの .mcp.json だけ","ワークツリーでは一切読まれない","本体の一番上の .mcp.json","~/.claude.json のものだけ"],"a":2,"e":"Desktop のワークツリーセッションは、.mcp.json を含むプロジェクトの設定を本体の一番上から読む。","refs":["parallel","mcp"]},{"q":"Cloud 環境のセッションで、自分の ~/.claude/settings.json に書いた deny が効いていない。理由は？","o":["Cloud では deny ルールが使えないから","Cloud は自分の PC のユーザー設定を読まないから","deny は Cloud に1日遅れて反映されるから","Cloud では ~/.claude.json に書く決まりだから"],"a":1,"e":"Cloud は別のマシンでリポジトリを複製して動くので、自分の ~/.claude/settings.json や settings.local.json は読まない。共有の .claude/settings.json にコミットすれば届く。","refs":["security","parallel"]},{"q":"Accept edits モードで字幕の SRT を直してもらったら、確認なしで書き換わった。これは？","o":["正常。Accept edits はファイル編集を自動で通す","異常。Accept edits でも編集は毎回確認が出る","異常。.srt には既定で deny が入っている","正常。Accept edits は Bash も全部自動で通す"],"a":0,"e":"Accept edits はファイル編集と基本的なファイル操作を自動で受け入れる。ただし Bash のコマンドすべてではないので、ffmpeg を入れるような操作は確認が出る。","refs":["video-edit","video"]}]};
LESSONS.forEach((L,i)=>L.n=i+1);
const TOTAL=LESSONS.length;

/* ---------- storage (per-viewer only) ---------- */
const KEY="cc-study-v4";
let S={};
try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}
/* questions were rewritten, so carry over only checks and memos of lessons that still exist */
try{if(!localStorage.getItem(KEY)){const old=JSON.parse(localStorage.getItem("cc-study-v3"));const ids=new Set(LESSONS.map(L=>L.id));
  if(old){Object.keys(old).forEach(id=>{if(ids.has(id)&&old[id]&&old[id].checks)S[id]={checks:old[id].checks,quiz:{},memo:old[id].memo||""}});localStorage.setItem(KEY,JSON.stringify(S))}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ls(id){S[id]=S[id]||{checks:[],quiz:{},memo:""};return S[id]}
function status(L){const s=S[L.id];if(!s)return"todo";
  if(L.checks.every((_,i)=>s.checks[i]))return"done";
  if(s.checks.some(Boolean)||Object.keys(s.quiz).length||s.memo)return"doing";return"todo"}

/* ---------- helpers ---------- */
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>esc(t).replace(/`([^`]+)`/g,"<code>$1</code>");
const $=s=>document.querySelector(s);
const app=$("#app");
const lvOf=k=>LEVELS.find(l=>l.key===k);
const lvStyle=k=>`--lvc:var(${lvOf(k).color})`;
let toastT;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1600)}
/* deterministic option order per question so the right answer is not always in the same slot */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function order(seed,n){return [...Array(n).keys()].sort((a,b)=>hash(seed+":"+a)-hash(seed+":"+b))}
const CLIP=[];
function codebox(label,text,isPrompt){const i=CLIP.push(text)-1;
  return `<div class="codebox${isPrompt?" prompt":""}"><div class="cap"><span>${esc(label)}</span><button class="copy" data-clip="${i}" type="button">コピー</button></div><pre>${esc(text)}</pre></div>`}
function askBlock(a,i,total){
  return `<div class="ask"><div class="ask-title">頼みごと${total>1?" "+(i+1):""}</div>
  <div class="voice"><small>まず声で（こんなふうに話す）</small>${esc(a[0])}</div>
  ${codebox("次に文章で（短く送るなら）",a[1],true)}</div>`}
function chip(st){return st==="done"?'<span class="chip done">完了</span>':st==="doing"?'<span class="chip doing">学習中</span>':'<span class="chip">未着手</span>'}
function meter(){const d=LESSONS.filter(L=>status(L)==="done").length;
  $("#meter-label").textContent=`${d} / ${TOTAL} 完了`;$("#meter-bar").style.width=(d/TOTAL*100)+"%"}
function quizHTML(q,qi,ans,seed,src){
  const ord=order(seed,q.o.length);
  return `<div class="q" data-q="${qi}"><p>Q${qi+1}. ${esc(q.q)}${src?`<span class="src">${esc(src)}</span>`:""}</p><div class="opts">${ord.map(oi=>{
    let cls="";if(ans!==undefined){if(oi===q.a)cls=" right";else if(oi===ans)cls=" wrong"}
    return `<button type="button" class="opt${cls}" data-o="${oi}"${ans!==undefined?" disabled":""}>${esc(q.o[oi])}</button>`}).join("")}</div>
    ${ans!==undefined?`<div class="exp"><b>${ans===q.a?"正解！":"おしい！"}</b> ${esc(q.e)}${src===undefined?` <button type="button" class="copy" data-retry="${qi}" style="color:var(--accent)">もう一度</button>`:""}</div>`:""}</div>`}

/* ---------- views ---------- */
function home(){
  const next=LESSONS.find(L=>status(L)!=="done");
  const qCount=LESSONS.reduce((a,L)=>a+L.quiz.length,0);
  let h=`<div class="intro"><h1>Claude Code を、<br>声で使いこなす。</h1>
  <p>初級・中級・上級の全${TOTAL}回、確認問題は全${qCount}問。各レベルの最後に、回をまたいだ場面問題の修了テスト（各${EXAMS["1"].length}問）がある。Claude Code ならではの画面・設定・仕組みだけを問う専門編。頼み方・確かめ方・安全の考え方など、どの AI にも共通する基本は「AI 入門ノート」にまとめた。コマンドは打たず、Claude デスクトップアプリに話しかけて進める。</p>
  <p>進み具合とメモは、このブラウザの中にだけ保存される。</p></div>`;
  if(next){const st=status(next);
    h+=`<div class="resume"><div style="flex:1;min-width:0"><b>${st==="doing"?"続きから":"次はここ"}：第${next.n}回（${lvOf(next.lv).name}）</b><br><span style="font-size:.95rem">${esc(next.title)}</span></div><a class="btn" href="#lesson-${next.n}">${st==="doing"?"再開する":"始める"}</a></div>`}
  else h+=`<div class="resume"><b>全${TOTAL}回を完了！ 作った仕組みを毎日の仕事で使いながら、育てていこう。</b></div>`;
  h+=`<div class="howto"><h2>声で頼むときの基本</h2><ol>
    <li>「目的 → 何を見て → 何をして → どんな形で出すか」の順に話す</li>
    <li>最後に「まだ変えないで」「送信しないで」など、止めることを添える</li>
    <li>送る前に、名前・数字・専門用語の誤変換だけ読み返す</li>
    <li>直すときは「2番を〜して」のように番号で言う</li>
    <li>APIキーやパスワードだけは、声でもチャットでも伝えない</li></ol></div>`;
  LEVELS.forEach(lv=>{
    const ls_=LESSONS.filter(L=>L.lv===lv.key);const d=ls_.filter(L=>status(L)==="done").length;
    const qn=ls_.reduce((a,L)=>a+L.quiz.length,0);
    const ex=examState(lv.key),en=EXAMS[lv.key].length;
    const ok=ex.best!=null&&ex.best>=passLine(lv.key);
    const best=ex.best==null?"まだ受けていない":`最高 <b class="${ok?"pass":""}">${ex.best} / ${en} 問（${Math.round(ex.best/en*100)}%）${ok?"・合格":""}</b>`;
    h+=`<section class="level" style="${lvStyle(lv.key)}"><div class="level-head"><div class="row"><h2>${lv.name}</h2><span class="cnt">${d} / ${ls_.length} 回完了・問題 ${qn} 問</span><span class="btns"><a class="btn" href="#test-${lv.key}">ランダム10問</a><a class="btn solid" href="#exam-${lv.key}">修了テスト</a></span></div><p>${lv.sub}</p><div class="exam-best">${lv.name}修了テスト（${en}問・8割で合格）：${best}</div></div>`;
    ls_.forEach(L=>{
      h+=`<a class="lesson-row" href="#lesson-${L.n}"><div class="num">${L.n}<small>回</small></div><div class="t"><b>${esc(L.title)}${L.isNew?'<span class="chip new">追加</span>':""}</b><span>成果物：${esc(L.deliv)}</span></div>${chip(status(L))}</a>`});
    h+=`</section>`});
  h+=`<p class="note-src">Luma で公開されている講座「Claude Code 基礎研修 全12回」のテーマ一覧をもとに、Anthropic の公式ドキュメント（2026年11月時点）で Claude Code ならではの機能を足して、自習用に独自に作った教材。講座の配布資料とは別物。Claude Code は更新が速いので、画面の操作や数字は Claude の公式ヘルプでも確認してね。</p>`;
  app.innerHTML=h;
}

let curLesson=0;
function lesson(n){
  const L=LESSONS[n-1];const s=ls(L.id);CLIP.length=0;curLesson=n;
  let h=`<div style="${lvStyle(L.lv)}"><div class="crumb"><a href="#">← レッスン一覧</a></div>
  <div class="lhead"><div class="eyebrow">${lvOf(L.lv).name} ／ 第${n}回</div><h1>${esc(L.title)}</h1>
  <div class="goal"><b>この回のゴール</b>${esc(L.goal)}</div></div>`;
  h+=`<section class="blk"><h2>先に覚える言葉</h2><dl class="terms">${L.terms.map(t=>`<div><dt>${esc(t[0])}</dt><dd>${esc(t[1])}</dd></div>`).join("")}</dl></section>`;
  h+=`<section class="blk"><h2>解説</h2><ul class="points">${L.points.map(p=>`<li>${fmt(p)}</li>`).join("")}</ul></section>`;
  h+=`<section class="blk"><h2>やってみる</h2><ol class="steps">${L.steps.map(p=>`<li><div>${fmt(p)}</div></li>`).join("")}</ol>`;
  L.asks.forEach((a,i)=>h+=askBlock(a,i,L.asks.length));
  if(L.files.length){h+=`<p class="files-note">Claude が作るファイルの例（見るだけでOK。自分で打たなくていい）</p>`;L.files.forEach(c=>h+=codebox(c[0],c[1],false))}
  h+=`</section>`;
  h+=`<section class="blk"><h2>気をつけること</h2><div class="warn"><b>注意：</b>${fmt(L.warn)}</div></section>`;
  const answered=Object.keys(s.quiz).length, right=L.quiz.filter((q,i)=>s.quiz[i]===q.a).length;
  h+=`<section class="blk"><h2>確認クイズ（${L.quiz.length}問）</h2><div class="quiz">${L.quiz.map((q,qi)=>quizHTML(q,qi,s.quiz[qi],L.id+qi)).join("")}</div>
    ${answered?`<div class="score">${answered} / ${L.quiz.length} 問回答・${right} 問正解${answered===L.quiz.length&&right===L.quiz.length?"　全問正解！":""}</div>`:""}</section>`;
  h+=`<section class="blk"><h2>できたことチェック</h2><div class="checks">${L.checks.map((c,ci)=>`<label for="c${L.id}-${ci}"><input type="checkbox" id="c${L.id}-${ci}" data-c="${ci}"${s.checks[ci]?" checked":""}><span>${esc(c)}</span></label>`).join("")}</div>
  ${status(L)==="done"?'<div class="done-banner">この回は完了！</div>':""}</section>`;
  h+=`<section class="blk"><h2>自分メモ</h2><textarea id="memo-${L.id}" placeholder="つまずいたところ、うまく伝わった言い方、自分の仕事でどう使うか など">${esc(s.memo)}</textarea></section>`;
  const p=LESSONS[n-2],x=LESSONS[n];
  h+=`<div class="pager">${p?`<a href="#lesson-${p.n}"><small>← 前の回</small>第${p.n}回 ${esc(p.title)}</a>`:"<span></span>"}${x?`<a class="next" href="#lesson-${x.n}"><small>次の回 →</small>第${x.n}回 ${esc(x.title)}</a>`:`<a class="next" href="#test-all"><small>仕上げ</small>総合テストへ</a>`}</div></div>`;
  app.innerHTML=h;

  app.querySelectorAll(".q button.opt").forEach(b=>b.addEventListener("click",()=>{
    const qi=+b.closest(".q").dataset.q;s.quiz[qi]=+b.dataset.o;save();rerender()}));
  app.querySelectorAll("[data-retry]").forEach(b=>b.addEventListener("click",()=>{delete s.quiz[+b.dataset.retry];save();rerender()}));
  app.querySelectorAll(".checks input").forEach(c=>c.addEventListener("change",()=>{
    s.checks[+c.dataset.c]=c.checked;save();meter();
    if(status(L)==="done"){toast(`第${n}回 完了！`);rerender()}}));
  const m=$("#memo-"+L.id);let mt;m.addEventListener("input",()=>{clearTimeout(mt);mt=setTimeout(()=>{s.memo=m.value;save()},400)});
}

/* random test: 10 questions from a level (or 15 from all), answers kept only for this run */
let T=null;
function newTest(key){
  const pool=[];LESSONS.filter(L=>key==="all"||L.lv===key).forEach(L=>L.quiz.forEach((q,i)=>pool.push({q,L,i})));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  T={key,items:pool.slice(0,key==="all"?15:10),ans:{},seed:String(Math.random())};
}
function test(key){
  if(!T||T.key!==key)newTest(key);
  const name=key==="all"?"総合":lvOf(key).name;
  const done=Object.keys(T.ans).length, right=T.items.filter((it,i)=>T.ans[i]===it.q.a).length;
  let h=`<div style="${key==="all"?"":lvStyle(key)}"><div class="test-head"><h1>${name}テスト（${T.items.length}問）</h1><button type="button" class="btn ghost" id="retest">問題を入れかえる</button></div>
  <p style="margin:0 0 6px;color:var(--muted)">レッスンの問題からランダムに出題。結果は保存されない。腕だめしの本番は各レベルの修了テストで：<a href="#exam-1">初級</a>・<a href="#exam-2">中級</a>・<a href="#exam-3">上級</a></p>
  <nav class="tabs" style="margin-bottom:16px"><a href="#test-1"${key==="1"?' aria-current="page"':""}>初級</a><a href="#test-2"${key==="2"?' aria-current="page"':""}>中級</a><a href="#test-3"${key==="3"?' aria-current="page"':""}>上級</a><a href="#test-all"${key==="all"?' aria-current="page"':""}>総合</a></nav>
  <div class="quiz">${T.items.map((it,i)=>quizHTML(it.q,i,T.ans[i],T.seed+i,`第${it.L.n}回「${it.L.title}」より`)).join("")}</div>`;
  if(done===T.items.length){
    const miss=T.items.filter((it,i)=>T.ans[i]!==it.q.a);
    const lessons=[...new Set(miss.map(it=>it.L))];
    h+=`<div class="result"><b>${right} / ${T.items.length} 問正解（${Math.round(right/T.items.length*100)}%）</b>
      ${lessons.length?`<p style="margin:6px 0 0">復習するとよい回：</p><ul>${lessons.map(L=>`<li><a href="#lesson-${L.n}">第${L.n}回 ${esc(L.title)}</a></li>`).join("")}</ul>`:`<p style="margin:6px 0 0">全問正解！ 別のレベルにも挑戦してみて。</p>`}
      <p style="margin:10px 0 0"><button type="button" class="btn" id="retest2">もう一回（問題を入れかえる）</button></p></div>`}
  else h+=`<div class="score">${done} / ${T.items.length} 問回答・${right} 問正解</div>`;
  h+=`</div>`;
  app.innerHTML=h;
  app.querySelectorAll(".q button.opt").forEach(b=>b.addEventListener("click",()=>{T.ans[+b.closest(".q").dataset.q]=+b.dataset.o;const y=scrollY;test(key);scrollTo(0,y)}));
  const re=()=>{newTest(key);test(key);scrollTo(0,0)};
  $("#retest").addEventListener("click",re);const r2=$("#retest2");if(r2)r2.addEventListener("click",re);
}

/* level final exam: fixed set per level, answers can be changed until "採点する", best score is saved */
function examState(key){S.__exam=S.__exam||{};S.__exam[key]=S.__exam[key]||{ans:{},graded:false,best:null};return S.__exam[key]}
const passLine=key=>Math.ceil(EXAMS[key].length*0.8);
function exam(key){
  const E=EXAMS[key],st=examState(key),lv=lvOf(key),graded=st.graded;
  const done=Object.keys(st.ans).length,right=E.filter((q,i)=>st.ans[i]===q.a).length;
  const byId=id=>LESSONS.find(L=>L.id===id);
  let h=`<div style="${lvStyle(key)}"><div class="test-head"><h1>${lv.name} 修了テスト（${E.length}問）</h1>${graded?`<button type="button" class="btn ghost" id="ex-reset">最初から受け直す</button>`:""}</div>
  <nav class="tabs" style="margin-bottom:12px"><a href="#exam-1"${key==="1"?' aria-current="page"':""}>初級</a><a href="#exam-2"${key==="2"?' aria-current="page"':""}>中級</a><a href="#exam-3"${key==="3"?' aria-current="page"':""}>上級</a><a href="#test-all">ランダム総合</a></nav>
  <div class="exam-rule"><b>ルール</b><ul><li>${lv.name}の複数の回の内容を組み合わせた、場面で考える問題。</li><li>全部答えてから「採点する」を押すまで、正解は出ない。答えは何度でも変えられる。</li><li>${passLine(key)}問以上（8割）で合格。いちばん良かった点数が保存される。</li></ul>${st.best!=null?`<p style="margin:6px 0 0">これまでの最高：${st.best} / ${E.length} 問${st.best>=passLine(key)?"（合格）":""}</p>`:""}</div>
  <div class="quiz">${E.map((q,qi)=>{
    const ord=order("exam"+key+":"+qi,q.o.length),a=st.ans[qi];
    const refs=(q.refs||[]).map(byId).filter(Boolean);
    return `<div class="q" data-q="${qi}"><p>Q${qi+1}. ${esc(q.q)}${graded?`<span class="mark ${a===q.a?"ok":"ng"}">${a===q.a?"正解":"不正解"}</span>`:""}</p><div class="opts">${ord.map(oi=>{
      let cls="";if(graded){if(oi===q.a)cls=" right";else if(oi===a)cls=" wrong"}else if(oi===a)cls=" sel";
      return `<button type="button" class="opt${cls}" data-o="${oi}"${graded?" disabled":""} aria-pressed="${oi===a}">${esc(q.o[oi])}</button>`}).join("")}</div>
      ${graded?`<div class="exp">${esc(q.e)}${refs.length?`<br>関係する回：${refs.map(L=>`<a href="#lesson-${L.n}">第${L.n}回</a>`).join("・")}`:""}</div>`:""}</div>`}).join("")}</div>`;
  if(graded){
    const pass=right>=passLine(key);
    const miss=[...new Set(E.filter((q,i)=>st.ans[i]!==q.a).flatMap(q=>q.refs||[]))].map(byId).filter(Boolean).sort((x,y)=>x.n-y.n);
    h+=`<div class="result${pass?"":" fail"}"><b>${right} / ${E.length} 問正解（${Math.round(right/E.length*100)}%）　${pass?"合格！":`不合格（あと${passLine(key)-right}問）`}</b>
      ${miss.length?`<p style="margin:6px 0 0">間違えた問題に関係する回：</p><ul>${miss.map(L=>`<li><a href="#lesson-${L.n}">第${L.n}回 ${esc(L.title)}</a></li>`).join("")}</ul>`:`<p style="margin:6px 0 0">全問正解！ ${key!=="3"?"次のレベルへ進もう。":"上級まで修了。"}</p>`}
      <p style="margin:10px 0 0"><button type="button" class="btn" id="ex-reset2">最初から受け直す</button></p></div>`}
  else h+=`<div class="score">${done} / ${E.length} 問回答</div><div class="sticky-submit"><button type="button" class="btn" id="ex-grade"${done<E.length?" disabled style=\"background:var(--sunk);color:var(--muted);border-color:var(--line);cursor:not-allowed\"":""}>${done<E.length?`あと${E.length-done}問`:"採点する"}</button></div>`;
  h+=`</div>`;
  app.innerHTML=h;
  app.querySelectorAll(".q button.opt").forEach(b=>b.addEventListener("click",()=>{st.ans[+b.closest(".q").dataset.q]=+b.dataset.o;save();const y=scrollY;exam(key);scrollTo(0,y)}));
  const g=$("#ex-grade");if(g&&done===E.length)g.addEventListener("click",()=>{st.graded=true;st.best=Math.max(st.best??0,right);save();exam(key);
    const r=app.querySelector(".result");if(r)r.scrollIntoView({behavior:"smooth",block:"center"})});
  const reset=()=>{st.ans={};st.graded=false;save();exam(key);scrollTo(0,0)};
  ["#ex-reset","#ex-reset2"].forEach(s=>{const b=$(s);if(b)b.addEventListener("click",reset)});
}

function glossary(){
  const all=[];LESSONS.forEach(L=>L.terms.forEach(t=>all.push({w:t[0],d:t[1],L})));
  app.innerHTML=`<h1 style="font-size:1.4rem;margin:.2em 0">用語集</h1><p style="color:var(--muted);margin:0">全${all.length}語。言葉か説明の一部で探せる。</p>
  <input class="search" id="gl-search" type="search" placeholder="例：スキル、フック、コンテキスト" aria-label="用語を検索"><div class="gl" id="gl-list"></div>`;
  const list=$("#gl-list"),q=$("#gl-search");
  function draw(){const k=q.value.trim().toLowerCase();
    const r=all.filter(t=>!k||(t.w+t.d).toLowerCase().includes(k));
    list.innerHTML=r.length?r.map(t=>`<div><b>${esc(t.w)}</b><a href="#lesson-${t.L.n}">${lvOf(t.L.lv).name}・第${t.L.n}回</a><p>${esc(t.d)}</p></div>`).join(""):`<p style="color:var(--muted)">「${esc(q.value)}」に合う言葉はなかった。別の言い方で探してみて。</p>`}
  q.addEventListener("input",draw);draw();
}

function rerender(){const y=window.scrollY;if(curLesson)lesson(curLesson);else route(true);meter();window.scrollTo(0,y)}
function route(keep){
  const h=location.hash.slice(1);const m=h.match(/^lesson-(\d+)$/);const t=h.match(/^test-(1|2|3|all)$/);const x=h.match(/^exam-(1|2|3)$/);curLesson=0;
  ["#tab-home","#tab-test","#tab-gl"].forEach(s=>$(s).removeAttribute("aria-current"));
  if(m&&+m[1]>=1&&+m[1]<=TOTAL){lesson(+m[1]);$("#tab-home").setAttribute("aria-current","page")}
  else if(t){test(t[1]);$("#tab-test").setAttribute("aria-current","page")}
  else if(x){exam(x[1]);$("#tab-test").setAttribute("aria-current","page")}
  else if(h==="glossary"){glossary();$("#tab-gl").setAttribute("aria-current","page")}
  else{home();$("#tab-home").setAttribute("aria-current","page")}
  meter();if(!keep)window.scrollTo(0,0);
}
app.addEventListener("click",e=>{const b=e.target.closest("[data-clip]");if(!b)return;
  const text=CLIP[+b.dataset.clip];
  const fallback=()=>{const pre=b.closest(".codebox").querySelector("pre");const r=document.createRange();r.selectNodeContents(pre);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast("選択したので、長押しかCtrl+Cでコピーしてね")};
  try{navigator.clipboard.writeText(text).then(()=>toast("コピーした"),fallback)}catch(err){fallback()}});
window.addEventListener("hashchange",()=>route(false));
route(false);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
